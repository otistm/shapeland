<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TUMBLE — elemental cube</title>
<style>
  :root{
    --ink:#22222a;
    --line:#dedcd8;
    --mute:#9a978f;
    --fire:#ff5a1f;
    --bolt:#3b46e0;
    --phys:#3a3a44;
    --norm:#c2beb8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);touch-action:none;
  }
  canvas{display:block}
  #flash{
    position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;
    mix-blend-mode:multiply;
  }
  .hud{position:fixed;z-index:10;pointer-events:none;user-select:none}

  #armed{top:max(18px,env(safe-area-inset-top));left:18px}
  #armed .eyebrow{
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);
    font-weight:600;margin-bottom:6px;
  }
  #armed .row{display:flex;align-items:center;gap:9px}
  #armed .swatch{
    width:12px;height:12px;border-radius:3px;background:var(--norm);
    transition:background .18s ease, transform .18s ease;
  }
  #armed .name{
    font-size:26px;font-weight:650;letter-spacing:.02em;line-height:1;
    font-variant-ligatures:none;
  }
  #armed .sub{
    font-size:11px;color:var(--mute);margin-top:7px;letter-spacing:.04em;max-width:190px;line-height:1.45
  }
  #burn{
    margin-top:11px;opacity:0;transform:translateY(-3px);
    transition:opacity .2s ease, transform .2s ease;
  }
  #burn.on{opacity:1;transform:none}
  #burn .bl{
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    font-weight:700;color:var(--fire);display:block;margin-bottom:5px;
  }
  #burn .bar{display:block;width:132px;height:3px;background:#efe9e4;overflow:hidden}
  #burn .bar i{display:block;height:100%;width:100%;background:var(--fire);transform-origin:left}
  #burn .tick{
    font-size:10px;letter-spacing:.12em;color:var(--mute);margin-top:5px;display:block
  }

  #stick{
    position:fixed;z-index:11;left:max(26px,env(safe-area-inset-left));
    bottom:max(30px,env(safe-area-inset-bottom));
    width:132px;height:132px;touch-action:none;
  }
  #dpad{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #dpad .frame{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round}
  #knob{
    position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:#fff;border:1.5px solid var(--ink);
    transition:border-color .15s ease;
  }
  #pivot{
    position:fixed;z-index:11;right:max(30px,env(safe-area-inset-right));
    bottom:max(46px,env(safe-area-inset-bottom));
    width:88px;height:88px;border-radius:50%;background:#fff;
    border:1.5px solid var(--ink);touch-action:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:9px;letter-spacing:.18em;font-weight:700;color:var(--ink);
    transition:transform .09s ease, background .12s ease, color .12s ease;
  }
  #pivot .gl{font-size:17px;line-height:1;letter-spacing:0}
  #pivot:active{transform:scale(.93)}
  #pivot.armed{background:var(--ink);color:#fff}

  .slot .ori{
    position:absolute;top:4px;left:0;right:0;text-align:center;
    font-size:8px;letter-spacing:.14em;font-weight:700;color:var(--ink);
  }
  .slot.down{border-color:var(--ink);border-width:2.5px}

  /* the touch controls retire when a gamepad appears */
  #stick, #pivot{ transition:opacity .35s ease, transform .35s ease }
  body.pad #stick, body.pad #pivot{ opacity:0; pointer-events:none; transform:scale(.9) }

  /* footer hint */
  #footer{
    position:fixed;z-index:12;left:0;right:0;
    bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #footer .hint{
    font-size:10px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;
  }
  /* equip lives where the title used to be */
  #topbar{
    position:fixed;z-index:12;top:max(16px,env(safe-area-inset-top));
    right:18px;display:flex;align-items:center;gap:10px;
  }
  .tbtn{
    pointer-events:auto;cursor:pointer;background:#fff;
    border:1.5px solid var(--ink);border-radius:2px;
    padding:11px 20px;font-size:11px;letter-spacing:.2em;font-weight:700;
    color:var(--ink);touch-action:manipulation;position:relative;
    transition:transform .09s ease;
  }
  .tbtn:active{transform:scale(.95)}
  .tbtn .dot{
    position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;
    background:var(--fire);opacity:0;transition:opacity .2s ease;
  }
  .tbtn.nudge .dot{opacity:1;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}

  #armed .under{font-size:10px;letter-spacing:.16em;color:var(--mute);margin-top:6px;font-weight:700}
  #pips{display:flex;gap:5px;margin-top:8px}
  #pips i{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:2px;background:var(--ink);transition:background .2s ease}
  #pips i.lost{background:transparent}
  /* location name: large, centred, a rule drawing itself beneath — the
     Elden Ring region title, translated into this game's ink */
  #locname{
    position:fixed;z-index:14;top:30%;left:0;right:0;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .9s ease;
  }
  #locname.show{opacity:1;transition:opacity .7s ease}
  #locname .t{
    font-size:21px;letter-spacing:.5em;padding-left:.5em;font-weight:700;
    color:var(--ink);text-transform:uppercase;
  }
  #locname .rule{
    width:0;height:1.5px;background:var(--ink);margin:12px auto 0;opacity:.7;
    transition:width 1.1s cubic-bezier(.2,.7,.2,1);
  }
  #locname.show .rule{width:170px}

  /* npc dialogue */
  #speak{
    position:fixed;z-index:12;left:50%;transform:translateX(-50%);
    bottom:max(96px,calc(env(safe-area-inset-bottom) + 66px));
    display:none;
  }
  #speak.on{display:block}
  #speak .btn{
    display:none;width:17px;height:17px;border-radius:50%;
    border:1.5px solid var(--ink);margin-right:9px;
    font-size:9px;line-height:14px;text-align:center;font-weight:700;letter-spacing:0;
    vertical-align:-3px;
  }
  body.pad #speak .btn{display:inline-block}
  #dialog{
    position:fixed;z-index:26;left:50%;transform:translateX(-50%);
    bottom:max(26px,env(safe-area-inset-bottom));
    width:min(560px,calc(100vw - 32px));
    background:#fff;border:1.5px solid var(--ink);border-radius:3px;
    padding:14px 18px 12px;display:none;cursor:pointer;user-select:none;
  }
  #dialog.open{display:block}
  #dialog .who{font-size:9px;letter-spacing:.3em;color:var(--mute);font-weight:700;margin-bottom:7px}
  #dialog .line{font-size:13px;letter-spacing:.04em;line-height:1.55;color:var(--ink);min-height:2.6em}
  #dialog .cue{font-size:8px;letter-spacing:.22em;color:var(--mute);text-align:right;margin-top:8px}

  #banner{
    position:fixed;z-index:14;top:24%;left:0;right:0;text-align:center;pointer-events:none;
    font-size:15px;letter-spacing:.42em;font-weight:700;color:var(--ink);
    opacity:0;transition:opacity .8s ease;text-transform:uppercase;
  }
  #banner.show{opacity:1}

  /* camera debug */
  #camdbg{
    position:fixed;z-index:20;top:max(64px,calc(env(safe-area-inset-top) + 56px));right:18px;
    width:262px;background:#fff;border:1.5px solid var(--ink);border-radius:3px;
    padding:12px 14px 14px;display:none;
    font-size:10px;letter-spacing:.08em;color:var(--ink);
  }
  #camdbg.open{display:block}
  #camdbg h3{font-size:9px;letter-spacing:.24em;margin:0 0 10px;color:var(--mute);font-weight:700}
  #camdbg .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  #camdbg .row label{width:52px;flex:none;font-weight:700;letter-spacing:.1em}
  #camdbg .row input{flex:1;min-width:0;accent-color:#22222a}
  #camdbg .row .v{width:44px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
  #camdbg pre{
    margin:11px 0 9px;padding:9px;background:#f7f6f4;border-radius:2px;
    font-size:9.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;color:#22222a;
  }
  #camdbg .acts{display:flex;gap:8px}
  #camdbg .acts button{
    flex:1;cursor:pointer;background:#fff;border:1.5px solid var(--ink);border-radius:2px;
    padding:7px 0;font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--ink);
  }

  /* equip overlay */
  #equip{
    position:fixed;inset:0;z-index:30;display:none;
    background:rgba(255,255,255,.93);backdrop-filter:blur(3px);
    overflow:auto;-webkit-overflow-scrolling:touch;
  }
  #equip.open{display:block}
  #equip .sheet{
    min-height:100%;display:flex;flex-direction:column;
    padding:max(20px,env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  #equip .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  #equip .top h2{font-size:12px;letter-spacing:.3em;font-weight:700;margin:0}
  #equip .note{font-size:11px;color:var(--mute);letter-spacing:.03em;line-height:1.5;margin:8px 0 18px}

  .net{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    margin:0 auto 6px;width:100%;max-width:400px;
  }
  .slot{
    position:relative;aspect-ratio:1;border:1.5px solid var(--line);border-radius:6px;
    background:#fff;display:flex;align-items:center;justify-content:center;
    background-size:cover;touch-action:none;cursor:grab;
    transition:border-color .12s ease, transform .12s ease;
  }
  .slot .tag{
    position:absolute;bottom:4px;left:0;right:0;text-align:center;
    font-size:8px;letter-spacing:.14em;color:var(--mute);font-weight:700;
  }
  .slot.hover{border-color:var(--ink);transform:scale(1.06)}
  .slot.opp{border-color:var(--fire);border-style:dashed}
  .slot.empty{border-style:dashed}

  .tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .chip{
    display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;
    border:1.5px solid var(--line);border-radius:40px;background:#fff;
    touch-action:none;cursor:grab;user-select:none;
    transition:border-color .12s ease, transform .12s ease;
  }
  .chip .sw{width:26px;height:26px;border-radius:5px;background-size:cover;border:1px solid var(--line)}
  .chip .nm{font-size:11px;letter-spacing:.14em;font-weight:700}
  .chip.sel{border-color:var(--ink);transform:scale(1.04)}
  #ghost{
    position:fixed;z-index:40;width:56px;height:56px;border-radius:8px;
    background-size:cover;pointer-events:none;opacity:.92;display:none;
    border:1.5px solid var(--ink);transform:translate(-50%,-50%);
  }
  @media (max-width:560px){ #footer .hint{display:none} #armed .sub{display:none} }
  @media (prefers-reduced-motion: reduce){ #flash{display:none} }
</style>
</head>
<body>
<div id="flash"></div>

<div class="hud" id="armed">
  <div class="eyebrow">Face up</div>
  <div class="row"><span class="swatch" id="sw"></span><span class="name" id="nm">Lightning</span></div>
  <div class="sub" id="sb">Jump to discharge it on landing.</div>
  <div class="under" id="underEl">UNDER · NORMAL</div>
  <div id="pips"><i></i><i></i><i></i></div>
  <div id="burn"><span class="bl">Burning</span><span class="bar"><i id="bfill"></i></span><span class="tick" id="btick">0 ticks</span></div>
</div>

<div id="stick">
  <svg id="dpad" viewBox="0 0 100 100" aria-hidden="true">
    <polygon class="frame" points="30,0 70,0 70,30 100,30 100,70 70,70 70,100 30,100 30,70 0,70 0,30 30,30"/>
  </svg>
  <div id="knob"></div>
</div>
<div id="topbar">
  <button class="tbtn" id="camBtn">CAM</button>
  <button class="tbtn" id="equipBtn">EQUIP<span class="dot"></span></button>
</div>

<div id="camdbg">
  <h3>CAMERA</h3>
  <div class="row"><label>YAW</label><input type="range" id="cYaw"  min="-180" max="180" step="0.5"><span class="v" id="vYaw"></span></div>
  <div class="row"><label>PITCH</label><input type="range" id="cPit" min="3" max="85" step="0.5"><span class="v" id="vPit"></span></div>
  <div class="row"><label>DIST</label><input type="range" id="cDst" min="4" max="45" step="0.1"><span class="v" id="vDst"></span></div>
  <div class="row"><label>FOV</label><input type="range" id="cFov" min="12" max="80" step="0.5"><span class="v" id="vFov"></span></div>
  <div class="row"><label>AIM Y</label><input type="range" id="cAim" min="-1" max="3" step="0.05"><span class="v" id="vAim"></span></div>
  <div class="row"><label>FOG N</label><input type="range" id="cFgN" min="2" max="200" step="1"><span class="v" id="vFgN"></span></div>
  <div class="row"><label>FOG F</label><input type="range" id="cFgF" min="10" max="400" step="1"><span class="v" id="vFgF"></span></div>
  <pre id="camOut"></pre>
  <div class="acts"><button id="camCopy">COPY</button><button id="camReset">RESET</button></div>
</div>

<button id="pivot"><span class="gl">⟳</span>PIVOT</button>

<div id="footer">
  <span class="hint" id="hintEl"></span>
</div>
<div id="banner"></div>
<div id="locname"><div class="t"></div><div class="rule"></div></div>
<button class="tbtn" id="speak"><span class="btn">Y</span>SPEAK</button>
<div id="dialog"><div class="who">THE KEEPER</div><div class="line"></div><div class="cue" id="dialogCue">TAP TO CONTINUE</div></div>

<div id="equip">
  <div class="sheet">
    <div class="top"><h2>EQUIP</h2><button class="tbtn" id="equipDone">DONE</button></div>
    <p class="note" id="equipNote"></p>
    <div class="net" id="net"></div>
    <p class="note" style="text-align:center;margin:14px 0 0">
      Drag an ability onto a face. Drag between faces to swap.<br>
      Opposite faces can never come up in the same roll.
    </p>
    <div class="tray" id="tray"></div>
  </div>
</div>
<div id="ghost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   TUMBLE — a white cube in a white room.
   Disney principles: shared squash spring, anticipation crouch, slow-in/fast-
   out roll ease, pivot-edge arcs, follow through, overlapping wobble, staging
   in a white void, exaggerated impacts, secondary dust/light/camera.

   VFX pass 2 — realism on a white stage:
     · ACES tone mapping, soft shadows, physical light falloff (decay=2)
     · pooled dynamic point lights: fire flickers 1/f-style, lightning strobes,
       impacts thump — colored light washing the white floor sells the hit
     · lightning is a tapered camera-facing ribbon (white core -> blue haze)
       that RESTRIKES twice, with ground arcs, not a 1px GL line
     · fire spawns a fireball shell + white-hot embers that cool through
       orange to smoke, plus a rising plume and an irregular charred scorch
     · physical gets a rolling dust shockwave, a crater decal, chunkier rubble,
       hit-stop (70ms at 12% speed) and a vertical camera kick
     · particles color-grade over their lifetime; dust and glow textures are
       painted blotches, not perfect circles
     · additive blending is useless over a white floor, so all "glow" is done
       with saturated colour, layered opacity, and real light on the ground
============================================================================ */

// ---------------------------------------------------------------- constants
const ROLL_DUR   = 0.19;
const CROUCH_DUR = 0.14;
const JUMP_V0    = 7.6;
const GRAV       = 25.0;
const HANG_ZONE  = 2.3;
const HANG_MUL   = 0.62;
const LEAP_CELLS = 2;       // a directional jump clears two cells
const TUCK_DUR  = 0.34;     // deliberately slower than a roll: it costs tempo
const TUCK_LIFT = 0.30;
const JUMP_BUFFER = 0.20;   // press jump this early and it still fires on landing

// flight time is fixed, so predict it once and drive the leap's horizontal
// travel from it; the vertical is still the real integrator, hang time and all
const FLIGHT_DUR = (() => {
  let y = 0.5, vy = JUMP_V0, t = 0;
  const h = 1/960;
  while (t < 4){
    const g = (Math.abs(vy) < HANG_ZONE) ? GRAV*HANG_MUL : GRAV;
    vy -= g*h; y += vy*h; t += h;
    if (y <= 0.5 && vy < 0) break;
  }
  return t;
})();
const smoothstep01 = t => t*t*(3 - 2*t);

const ABILITY = {
  fire:      { label:'Fire',      color:0xff5a1f, css:'#ff5a1f', line:'Scorches the ground where it lands.' },
  lightning: { label:'Lightning', color:0x3b46e0, css:'#3b46e0', line:'Calls a bolt down onto itself.' },
  physical:  { label:'Physical',  color:0x3a3a44, css:'#3a3a44', line:'Cracks the floor and throws rubble.' },
  normal:    { label:'Normal',    color:0xc2beb8, css:'#c2beb8', line:'Nothing but a puff of dust.' },
};
// Mutable: the cube ships blank and the player equips it. Index order matches
// BoxGeometry material groups: +X, -X, +Y, -Y, +Z, -Z.
let faceAbility = ['normal','normal','normal','normal','normal','normal'];
const FACE_LABEL = ['RIGHT','LEFT','TOP','BOTTOM','FRONT','BACK'];
const FACE_OPPOSITE = [1, 0, 3, 2, 5, 4];   // a roll can never bring these up together
const FACE_NORMAL = [
  new THREE.Vector3( 1,0,0), new THREE.Vector3(-1,0,0),
  new THREE.Vector3(0, 1,0), new THREE.Vector3(0,-1,0),
  new THREE.Vector3(0,0, 1), new THREE.Vector3(0,0,-1),
];

// ---------------------------------------------------------------- boot
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 42, 110);  // must stay clear of the camera distance

// 0 deg yaw, 27 deg pitch, 42 deg FOV: a straight-on view down -Z. Scaling the
// offset uniformly zooms without disturbing either angle. Note that at yaw 0
// the world axes line up with the screen axes, which makes the four cardinal
// stick directions perfectly unambiguous and pure diagonals a dead heat.
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const CAM_OFFSET = new THREE.Vector3(0.0, 8.0, 15.45);
const VIEW_DIR = CAM_OFFSET.clone().normalize();   // rebuilt if the camera moves
let camLookY = 0.55;   // height the camera aims at, just above the cube's middle

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e7f2, 0.8));
const sun = new THREE.DirectionalLight(0xfffdf6, 0.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 1.8;   // each texel now covers more world, so blur less
sun.shadow.bias = -0.0012;
/*  The shadow frustum follows the cube, so it must be wide enough to contain
    every shadow-caster that is ON SCREEN. At ±8 it was narrower than the view
    (13.4 units tall, and far more ground than that at this pitch), so the
    sentries' and walls' shadows were sliced off at the frustum edge and
    landed as hard-edged rectangles across the scene. Sized to the view now.  */
const SHADOW_EXTENT = 22;
const sc = sun.shadow.camera;
sc.left = -SHADOW_EXTENT; sc.right = SHADOW_EXTENT;
sc.top = SHADOW_EXTENT; sc.bottom = -SHADOW_EXTENT;
sc.near = 1; sc.far = 70;
scene.add(sun);
scene.add(sun.target);

/* ===================== TOON SHADING, game-wide ===========================
   One shared gradient ramp drives every lit surface. MeshToonMaterial with a
   NearestFilter DataTexture quantises the light response into flat bands —
   the same idiom as the painted glyphs and the SDF flame: areas of flat tone
   meeting at a clean edge, instead of a continuous falloff.

   Three bands, deliberately high-key so the world stays white:
     shadow 0.62 · half-tone 0.84 · lit 1.0
   With three nearest-filtered texels the band edges land at dotNL = ±1/3.
   Under the key light (screen-left, high) the cube's top and sun-side faces
   sit in the lit band, the camera-facing face in the half-tone, and the far
   side in shadow — a readable three-value drawing of every object. The
   hemisphere ambient stays continuous, which keeps the white world airy.
   Emissive (the burn glow, the face telegraph) bypasses the ramp by design:
   things that EMIT light should not be shaded like things that receive it. */
const TOON_BANDS = [0.62, 0.84, 1.0];
const toonRamp = (() => {
  const n = TOON_BANDS.length;
  const data = new Uint8Array(n*3);
  TOON_BANDS.forEach((v, i) => { data[i*3] = data[i*3+1] = data[i*3+2] = Math.round(v*255); });
  const t = new THREE.DataTexture(data, n, 1, THREE.RGBFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;   // hard band edges
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
})();
// drop-in replacement for MeshStandardMaterial across the game
function makeToon(opts){
  const o = { ...opts };
  delete o.roughness; delete o.metalness;            // meaningless under toon
  return new THREE.MeshToonMaterial({ gradientMap: toonRamp, ...o });
}

// pooled effect lights — colored light on the white floor is the realism lever
const fxLights = [];
for (let i=0;i<4;i++){
  const L = new THREE.PointLight(0xffffff, 0, 12, 2);
  L.visible = false;
  scene.add(L);
  fxLights.push({ L, live:false, t:0, dur:1, peak:1, kind:'thump', seed:0 });
}
function lightBurst(pos, color, peak, dur, kind, y){
  const f = fxLights.find(x => !x.live) || fxLights[0];
  f.live = true; f.t = 0; f.dur = dur; f.peak = peak; f.kind = kind;
  f.seed = Math.random()*100;
  f.L.color.setHex(color);
  f.L.position.set(pos.x, y === undefined ? 1.1 : y, pos.z);
  f.L.visible = true;
  return f;
}
function stepLights(dt, t){
  for (const f of fxLights){
    if (!f.live) continue;
    f.t += dt;
    const k = f.t/f.dur;
    if (k >= 1){ f.live = false; f.L.visible = false; f.L.intensity = 0; continue; }
    const decay = Math.pow(1-k, 1.7);
    let env = decay;
    if (f.kind === 'fire'){
      // layered flicker: real flames gutter across several frequencies
      const n = 0.74
        + 0.16*Math.sin((t+f.seed)*29.0)
        + 0.10*Math.sin((t+f.seed)*47.3 + 1.3)
        + 0.07*Math.sin((t+f.seed)*11.7 + 3.9);
      env = decay * n;
      f.L.position.y = 0.9 + 0.13*Math.sin((t+f.seed)*21.0);
    }
    else if (f.kind === 'strobe'){
      // discharge chatter: a hard random gate that dies out
      const gate = Math.sin((t+f.seed)*167.0) > -0.3 ? 1 : 0.1;
      env = decay * gate;
    }
    // 'thump' = plain smooth decay
    f.L.intensity = f.peak * Math.max(0, env);
  }
}

// One tile spans 4 world units; lines sit on half-integers, which is exactly
// where the cube's cell boundaries fall, so a roll always crosses one line.
const GRID_PERIOD = 4;
function gridTexture(){
  const PX = 128;                       // pixels per world unit
  const S = PX*GRID_PERIOD;

  const g = c.getContext('2d');

    g.lineWidth = major ? 6 : 3.5;

    g.beginPath(); g.moveTo(0, at); g.lineTo(S, at); g.stroke();
  }

}

// ---------------------------------------------------------------- the cube
function faceCanvas(kind){
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  /*  The cube is the only saturated mass in a white room, so it carries its
      own contrast instead of needing an outline. The toon ramp MULTIPLIES
      this base, so the shadow band lands at 0.62x — the value is chosen so
      even that darkest band stays a readable blue rather than going black. */
  g.fillStyle = '#4a7fd4'; g.fillRect(0,0,S,S);
  g.lineJoin = 'round'; g.lineCap = 'round';

  /*  On a saturated base the glyphs need their own separation: Fire's orange
      sits at almost exactly the blue's luminance and would vibrate. Each
      shape is stroked with a light halo before it is filled, so the ability
      colours stay EXACTLY as authored — the same values the VFX and HUD use
      — while still reading cleanly against the body.                       */
  const halo = (path, fill) => {
    path();
    g.strokeStyle = 'rgba(238,244,252,0.95)'; g.lineWidth = 13;
    g.stroke();
    path();
    g.fillStyle = fill; g.fill();
  };

  if (kind === 'fire'){
    halo(() => {
      g.beginPath();
      g.moveTo(128, 56);
      g.bezierCurveTo(184, 106, 190, 144, 170, 172);
      g.bezierCurveTo(159, 190, 142, 200, 128, 200);
      g.bezierCurveTo(114, 200, 97, 190, 86, 172);
      g.bezierCurveTo(66, 144, 72, 106, 128, 56);
      g.closePath();
    }, '#ff5a1f');
    g.fillStyle = '#ffbe4d';
    g.beginPath();
    g.moveTo(128, 118);
    g.bezierCurveTo(154, 142, 154, 160, 143, 174);
    g.bezierCurveTo(137, 182, 132, 186, 128, 186);
    g.bezierCurveTo(124, 186, 119, 182, 113, 174);
    g.bezierCurveTo(102, 160, 102, 142, 128, 118);
    g.closePath(); g.fill();
  }
  else if (kind === 'lightning'){
    halo(() => {
      g.beginPath();
      g.moveTo(150, 50); g.lineTo(92, 142); g.lineTo(124, 142);
      g.lineTo(106, 208); g.lineTo(168, 112); g.lineTo(134, 112);
      g.closePath();
    }, '#3b46e0');
    g.fillStyle = '#ffd23f';
    g.beginPath();
    g.moveTo(146, 74); g.lineTo(110, 134); g.lineTo(124, 134);
    g.lineTo(120, 168); g.lineTo(140, 122); g.lineTo(126, 122);
    g.closePath(); g.fill();
  }
  else if (kind === 'physical'){
    halo(() => {
      g.beginPath();
      for (let i=0;i<16;i++){
        const a = (i/16)*Math.PI*2 - Math.PI/2;
        const r = (i%2===0) ? 84 : 40;
        const x = 128 + Math.cos(a)*r, y = 128 + Math.sin(a)*r;
        i === 0 ? g.moveTo(x,y) : g.lineTo(x,y);
      }
      g.closePath();
    }, '#3a3a44');
    g.fillStyle = '#eef4fc';
    g.beginPath(); g.arc(128,128,17,0,Math.PI*2); g.fill();
  }
  else {
    // Normal is an absence, so it is simply the body's own light: a hollow
    // ring in the same family as the cube, needing no halo
    g.strokeStyle = 'rgba(238,244,252,0.9)'; g.lineWidth = 9;
    g.beginPath(); g.arc(128,128,50,0,Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(238,244,252,0.9)';
    g.beginPath(); g.arc(128,128,9,0,Math.PI*2); g.fill();
  }
  return c;
}
// one canvas + texture per ability, shared by the cube and the equip screen so

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}

function roundedBox(size, radius, seg){
  const geo = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = geo.attributes.position;
  const h = size/2, inner = h - radius;
  const v = new THREE.Vector3(), core = new THREE.Vector3(), dir = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    core.set(
      Math.max(-inner, Math.min(inner, v.x)),
      Math.max(-inner, Math.min(inner, v.y)),
      Math.max(-inner, Math.min(inner, v.z))
    );
    dir.subVectors(v, core);
    const len = dir.length();
    if (len > 1e-6){
      dir.multiplyScalar(radius/len);
      pos.setXYZ(i, core.x+dir.x, core.y+dir.y, core.z+dir.z);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

// ---------------------------------------------------------------- fx: burning cube
/*  Three pieces, so the fire reads as COMING FROM the cube and SPREADING to
    the ground, not as a bonfire the cube stands in:
      SHELL — flame climbing the cube's own geometry, its leading edge a
        scalloped line of tongues driven by sines around the cube's axis.
      PLUMES — six SDF flame quads anchored at the cube's TOP, so the column
        pours off the burning body instead of rising out of the floor.
      AOE — a ground aura that lags behind the cube: a petal-edged ring stroke
        at the damage radius over a faint tint disc, ringed by eight small
        ground-tuft flames, with a clean pulse stroke sweeping outward on each
        damage tick. The tick's scorch, embers and ring all live at the AOE
        radius, so the area of effect is legible as an area.                 */
const AOE_R = 1.55;                                // damage radius, world units
const FLAME_VERT = `
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

/*  Shared drawing kit. Everything elemental is built from signed distance
    fields and resolved with crisp(), a derivative-width edge that gives the
    same clean anti-aliased silhouette the cube's own painted glyphs have.
    No noise textures anywhere: shapes are made of circles and capsules,
    animated by smooth sines, so they stay rounded and deliberate the way the
    rest of the world is. Palette is lifted straight off the face decals.   */
const GFX_LIB = `
  float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0 - 2.0*f);
    return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), u.x),
               mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), u.x), u.y);
  }
  float fbm(vec2 p){
    float v = 0.0, a = 0.55;
    for (int i = 0; i < 4; i++){ v += a*vnoise(p); p *= 2.07; a *= 0.5; }
    return v;
  }
  // continuous blackbody-style ramp: white-hot -> yellow -> orange -> red ->
  // ember -> smoke grey. Saturated, never pastel, so it reads on white.
  vec3 fireRamp(float T){
    vec3 c = mix(vec3(0.54,0.52,0.50), vec3(0.55,0.13,0.020), smoothstep(0.04, 0.18, T));
    c = mix(c, vec3(0.90,0.26,0.04), smoothstep(0.18, 0.38, T));
    c = mix(c, vec3(1.00,0.55,0.08), smoothstep(0.38, 0.62, T));
    c = mix(c, vec3(1.00,0.83,0.35), smoothstep(0.62, 0.82, T));
    c = mix(c, vec3(1.00,0.97,0.88), smoothstep(0.82, 0.97, T));
    return c;
  }
`;


/*  FLAME — particles, moved by fire dynamics rather than decoration.
    Each particle is a flat drawn lick (SDF teardrop, crisp edge, flat bands
    keyed to its temperature) so the LOOK stays in this world's idiom, but
    what it DOES is taken from how real diffusion flames behave:

      BUOYANCY    hot gas accelerates upward under the density deficit, so
                  particles speed up as they leave the source and slow as
                  they cool. Nothing moves at a constant authored speed.
      PUFFING     real pool fires shed a toroidal vortex at f = 1.5/sqrt(D)
                  Hz. Emission pulses on that clock, which is what produces
                  the rising bulges that read unmistakably as fire.
      NECKING     the column contracts just above the base where air is
                  entrained, then bulges where the vortex rolls up.
      ENTRAINMENT above the neck the plume widens roughly linearly with
                  height (measured slope ~0.17, the real plume value).
      COOLING     temperature decays exponentially; it drives colour, size,
                  buoyancy and lifetime together, so particles hand off from
                  flame to smoke on their own instead of being told to.
      SWIRL       each puff cohort carries a counter-rotating tangential
                  velocity that spins down.
    Licks also stretch and align to their own velocity, so the shapes lean
    into the motion the way flame tongues do.                              */
const FIRE_MAX = 340;
const FIRE = {
  D: 1.0,                       // source width -> sets the puffing frequency
  buoy: 10.0, tau: 0.36, drag: 1.2,
  entrain: 0.16, neckAmt: 0.45, neckH: 0.22, neckW: 0.16, radK: 6.0,
  swirl0: 2.2, swirlTau: 0.5,
  v0: 0.6, r0: 0.30, maxAge: 1.35,
  baseRate: 64, puffN: 18,
};
FIRE.puffHz = 1.5/Math.sqrt(FIRE.D);

/*  Each particle is a small piece of flame: a disc eroded by animated fbm so
    its edge tears and dissolves, coloured by ITS OWN temperature on a
    continuous blackbody ramp. Hot particles are dense and bright; as they
    cool the erosion eats them from the rim inward and the ramp walks down
    through orange, red, ember and finally smoke grey. Orientation and
    stretch still follow the particle's velocity, so the physics reads.    */
const FIRE_FRAG = `
  uniform float uTime;
  varying float vT, vA, vPhi, vStretch, vSeed;
  ${GFX_LIB}
  void main(){
    vec2 q = vec2(gl_PointCoord.x - 0.5, 0.5 - gl_PointCoord.y);
    float c = cos(vPhi), s = sin(vPhi);
    q = vec2(q.x*c + q.y*s, -q.x*s + q.y*c);
    q.y /= vStretch;
    float r = length(q)*2.0;
    // erosion field advects upward through the sprite and bites harder as it cools
    float n = fbm(q*3.1 + vec2(vSeed*13.7, vSeed*7.1 - uTime*1.9));
    // cooling both shrinks the body and raises the tear threshold, so a dying
    // particle breaks into ragged remnants instead of politely fading
    float d = r - (0.90 - 0.40*(1.0 - vT)) + (0.52 - n)*(0.60 + 0.85*(1.0 - vT));
    float a = (1.0 - smoothstep(-0.22, 0.10, d)) * vA;
    if (a < 0.012) discard;
    // interior temperature rises toward the sprite centre; smoke stays flat
    float Tlocal = vT * (1.0 + 0.55*(1.0 - r)*step(0.16, vT));
    vec3 col = fireRamp(clamp(Tlocal, 0.0, 1.0));
    gl_FragColor = vec4(col, a * (vT > 0.16 ? 0.92 : 0.40));
  }`;


const fireGeo = new THREE.BufferGeometry();
for (const [name, size] of [['position',3],['aSize',1],['aPhi',1],['aStretch',1],['aT',1],['aA',1],['aSeed',1]])
  fireGeo.setAttribute(name, new THREE.BufferAttribute(new Float32Array(FIRE_MAX*size), size));
fireGeo.setDrawRange(0, 0);
const fireMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:{ value:0 } },
  transparent:true, depthWrite:false,
  extensions:{ derivatives:true },
  vertexShader:`
    attribute float aSize, aPhi, aStretch, aT, aA, aSeed;
    varying float vT, vA, vPhi, vStretch, vSeed;
    void main(){
      vT = aT; vA = aA; vPhi = aPhi; vStretch = aStretch; vSeed = aSeed;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (340.0 / max(0.001, -mv.z));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: FIRE_FRAG,
});
const firePoints = new THREE.Points(fireGeo, fireMat);
firePoints.frustumCulled = false;
firePoints.renderOrder = 3;
scene.add(firePoints);

// screen basis for aligning licks to their motion (camera never rotates)
const SCR_RIGHT = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), VIEW_DIR).normalize();
const SCR_UP    = new THREE.Vector3().crossVectors(VIEW_DIR, SCR_RIGHT).normalize();

const fireParts = [];
let puffPhase = 0, baseAcc = 0, swirlSign = 1;

function spawnFire(ax, az, y, scale, cohort){
  if (fireParts.length >= FIRE_MAX) return;
  const th = Math.random()*Math.PI*2;
  fireParts.push({
    ax, az, y, y0: y, th,
    r0: FIRE.r0*scale*(0.6 + Math.random()*0.5),
    r:  FIRE.r0*scale*(0.75 + Math.random()*0.4),
    vy: FIRE.v0*(0.7 + Math.random()*0.6),
    T: 1, age: 0, cohort, scale,
    swirl: swirlSign*FIRE.swirl0*(0.6 + Math.random()*0.8),
    size: (0.34 + Math.random()*0.22)*scale,
    seed: Math.random()*10,
    phi: 0, stretch: 1,
    px: 0, py: 0, pz: 0,
  });
}

function stepFire(dt, bi, baseY, ax, az, ringPts){
  // ---- emission on the puffing clock
  if (bi > 0.05){
    baseAcc += dt*FIRE.baseRate*bi;
    while (baseAcc >= 1){ baseAcc -= 1; spawnFire(ax, az, baseY + 0.5, 1, 0); }
    puffPhase += dt*FIRE.puffHz;
    if (puffPhase >= 1){
      puffPhase -= 1;
      swirlSign *= -1;                       // counter-rotating successive puffs
      const n = Math.round(FIRE.puffN*bi);
      for (let i=0;i<n;i++) spawnFire(ax, az, baseY + 0.45, 1, 1);
      // the ground ring puffs on the same clock, a beat later and smaller
      if (ringPts) for (const rp of ringPts) if (Math.random() < 0.75)
        spawnFire(rp.x, rp.z, 0.04, 0.5, 1);
    }
  }
  // ---- integrate
  const pa = fireGeo.attributes;
  for (let i=fireParts.length-1;i>=0;i--){
    const q = fireParts[i];
    q.age += dt;
    q.T -= q.T*dt/FIRE.tau;
    const prevY = q.y, prevR = q.r, prevTh = q.th;

    q.vy += FIRE.buoy*q.T*dt;                // buoyant acceleration
    q.vy -= FIRE.drag*q.vy*dt;
    // height above the point of emission: the neck and the entrainment cone
    // are both measured from where the gas leaves the source, not from the floor
    const hh = Math.max(0, q.y - q.y0);
    const neck = 1 - FIRE.neckAmt*Math.exp(-Math.pow((hh - FIRE.neckH)/FIRE.neckW, 2));
    const targetR = q.r0*neck + FIRE.entrain*Math.max(0, hh - FIRE.neckH);
    q.r += (targetR - q.r)*Math.min(1, dt*FIRE.radK);
    q.th += q.swirl*dt;
    q.swirl -= q.swirl*dt/FIRE.swirlTau;
    q.y += q.vy*dt;

    if (q.T < 0.05 || q.age > FIRE.maxAge){ fireParts.splice(i, 1); continue; }

    q.px = q.ax + Math.cos(q.th)*q.r;
    q.py = q.y;
    q.pz = q.az + Math.sin(q.th)*q.r;
    // velocity in screen space -> lick orientation and elongation
    const vx = (q.px - (q.ax + Math.cos(prevTh)*prevR))/Math.max(dt,1e-4);
    const vz = (q.pz - (q.az + Math.sin(prevTh)*prevR))/Math.max(dt,1e-4);
    const vyv = (q.y - prevY)/Math.max(dt,1e-4);
    const sx = vx*SCR_RIGHT.x + vz*SCR_RIGHT.z;
    const sy = vx*SCR_UP.x + vyv*SCR_UP.y + vz*SCR_UP.z;
    q.phi = Math.atan2(sx, Math.max(1e-4, sy));       // 0 = pointing screen-up
    const spd = Math.hypot(sx, sy);
    q.stretch = 1 + Math.min(1.15, spd*0.22);
    q.size += dt*0.30*q.scale;                        // expansion as it entrains
  }
  // ---- upload
  let n = 0;
  for (const q of fireParts){
    const fade = q.T > 0.16
      ? Math.min(1, q.T*3.2)
      : Math.max(0, 0.5*(q.T/0.16))*Math.max(0, 1 - q.age/FIRE.maxAge);
    pa.position.setXYZ(n, q.px, q.py, q.pz);
    pa.aSize.setX(n, q.size);
    pa.aPhi.setX(n, q.phi);
    pa.aStretch.setX(n, q.stretch);
    pa.aT.setX(n, q.T);
    pa.aA.setX(n, fade*Math.min(1, bi*1.6 + 0.25));
    pa.aSeed.setX(n, q.seed);
    n++;
  }
  fireGeo.setDrawRange(0, n);
  for (const k of ['position','aSize','aPhi','aStretch','aT','aA','aSeed']) pa[k].needsUpdate = true;
  firePoints.visible = n > 0;
}

/*  SHELL — the cube's surface burns in world space: fbm advected up world-Y
    even as the body tumbles, biting hardest at the top, on the same
    blackbody ramp as the particles so skin and plume read as one fire.    */
const SHELL_FRAG = `
  uniform float uTime, uIntensity, uBaseY;
  varying vec3 vW;
  ${GFX_LIB}
  void main(){
    float h = clamp((vW.y - uBaseY)/1.16, 0.0, 1.0);
    float n  = fbm(vec2(vW.x*2.7 + vW.z*2.0,        vW.y*2.3 - uTime*2.7));
    float n2 = fbm(vec2(vW.z*3.2 - vW.x*1.5 + 7.3,  vW.y*2.9 - uTime*3.5));
    float d = (n*0.75 + n2*0.45) - (1.0 - h)*0.55 - 0.20 - (1.0 - uIntensity)*0.8;
    d = clamp(d, 0.0, 1.0);
    if (d < 0.02) discard;
    vec3 col = fireRamp(0.30 + d*0.66);

/*  AOE — burning ground: an inner heat shimmer and a flame ring torn by

const AOE_FRAG = `
  uniform float uTime, uIntensity, uPulse;
  varying vec2 vUv;

  void main(){

const RING_DIRS = [];
for (let i=0;i<8;i++){
  const a = (i/8)*Math.PI*2 + 0.31;

function ringEmitters(centre){
  for (let i=0;i<RING_DIRS.length;i++){
    _ringOut[i].x = centre.x + RING_DIRS[i].x;
    _ringOut[i].z = centre.z + RING_DIRS[i].z;

const aoePos = new THREE.Vector3();
let aoePulse = 0, aoeReady = false;

const burnLight = new THREE.PointLight(0xff7a2a, 0, 11, 2);
burnLight.visible = false;

const burn = {
  dur:0, t:0, char:0, heat:0, ticks:0, tickT:0,
  emberAcc:0, smokeAcc:0,
  lean: new THREE.Vector3(), prev: new THREE.Vector3(0,0.5,0),
};
const BURN_BASE = 3.4, BURN_CAP = 6.5, BURN_TICK = 0.42;

function ignite(){
  // re-triggering while alight refreshes and extends, up to a cap
  const remain = Math.max(0, burn.dur - burn.t);
  burn.dur = Math.min(BURN_CAP, remain + BURN_BASE);
  burn.t = 0;
  burn.tickT = 0;
}
function burnIntensity(){
  if (burn.dur <= 0) return 0;
  const k = burn.t/burn.dur;
  const inRamp  = Math.min(1, burn.t/0.14);
  const outRamp = Math.min(1, (1 - k)/0.3);
  return Math.max(0, inRamp*outRamp);
}
function isBurning(){ return burn.dur > 0; }

function stepBurn(dt, t, baseY){
  if (burn.dur > 0){
    burn.t += dt;
    if (burn.t >= burn.dur){ burn.dur = 0; burn.t = 0; }
  }
  const bi = burnIntensity();

  // soot builds while alight and weathers off slowly; heat lingers past the flame
  burn.char = Math.max(0, Math.min(1, burn.char + (bi > 0.05 ? dt/1.5 : -dt/5.5)));
  burn.heat = Math.max(bi, burn.heat - dt*0.34);

  // flames drag behind the cube's motion
  const vx = (state.pos.x - burn.prev.x)/Math.max(dt, 1e-4);
  const vz = (state.pos.z - burn.prev.z)/Math.max(dt, 1e-4);
  burn.prev.copy(state.pos);
  const lx = Math.max(-0.24, Math.min(0.24, -vx*0.045));
  const lz = Math.max(-0.24, Math.min(0.24, -vz*0.045));
  burn.lean.lerp(tmpV.set(lx, 0, lz), Math.min(1, dt*9));

  // plume: particles emitted at the cube's top face on the puffing clock
  stepFire(dt, bi, baseY,
           cubeRig.position.x + burn.lean.x,
           cubeRig.position.z + burn.lean.z,
           bi > 0.05 ? ringEmitters(aoePos) : null);
  fireMat.uniforms.uTime.value = t;

  // flame skin on the cube itself
  fireShell.visible = bi > 0.01;
  if (fireShell.visible){
    shellMat.uniforms.uTime.value = t;
    shellMat.uniforms.uIntensity.value = bi;
    shellMat.uniforms.uBaseY.value = baseY;
  }

  // ground AOE aura: lags a beat behind the cube, like heat it's shedding
  if (bi > 0.01){
    if (!aoeReady){ aoePos.set(state.pos.x, 0, state.pos.z); aoeReady = true; }
    aoePos.lerp(tmpV.set(state.pos.x, 0, state.pos.z), 1 - Math.exp(-8*dt));
    aoeRig.visible = true;
    aoePos.y = H(Math.round(cubeRig.position.x), Math.round(cubeRig.position.z)) + 0.02;
    aoeRig.position.copy(aoePos);
    aoePulse = Math.max(0, aoePulse - dt*2.2);
    aoeMat.uniforms.uTime.value = t;
    aoeMat.uniforms.uIntensity.value = bi;
    aoeMat.uniforms.uPulse.value = aoePulse;
  } else {
    aoeRig.visible = false;
    aoeReady = false;
  }

  // firelight: flicker on top of the burn envelope
  burnLight.visible = burn.heat > 0.02;
  if (burnLight.visible){
    const flick = 0.74 + 0.16*Math.sin(t*29.0) + 0.10*Math.sin(t*47.3 + 1.3);
    burnLight.intensity = 3.2 * burn.heat * flick;
    burnLight.position.set(cubeRig.position.x, baseY + 0.65, cubeRig.position.z);
    burnLight.color.setRGB(1, 0.45 + 0.12*burn.heat, 0.14);
  }

  if (bi > 0.05){
    // embers peel off the cube's surface, white-hot cooling to dull red
    burn.emberAcc += dt*bi*30;
    while (burn.emberAcc >= 1){
      burn.emberAcc -= 1;
      emit({ pos:tmpV.set(cubeRig.position.x, baseY + 0.5, cubeRig.position.z),
             count:1, tex:'ember', color:[0xffe9a8,0xffc25a], colorEnd:0xb3300a, cPow:0.5,
             speed:0.55, up:2.4, grav:2.6, drag:1.2, size:0.1, grow:-0.55,
             life:0.85, spread:0.9, fade:1.1, turb:2.4 });
    }
    // and a thin plume off the top
    burn.smokeAcc += dt*bi*7;
    while (burn.smokeAcc >= 1){
      burn.smokeAcc -= 1;
      emit({ pos:tmpV.set(cubeRig.position.x, baseY + 1.55, cubeRig.position.z),
             count:1, tex:'puff', color:0x9a938b, colorEnd:0xdedad4, cPow:1.4,
             speed:0.35, up:1.7, grav:-1.1, drag:1.2, size:0.24, grow:3.0,
             life:1.7, spread:0.45, fade:2.1, turb:1.6 });
    }
    // damage-over-time beat: a flare-up on every tick
    burn.tickT += dt;
    while (burn.tickT >= BURN_TICK){
      burn.tickT -= BURN_TICK;
      burn.ticks++;
      onBurnTick(baseY);
    }
  }
  return bi;
}

function onBurnTick(baseY){
  const p = tmpV.set(aoePos.x, 0, aoePos.z);
  lightBurst(p, 0xff8c34, 2.4, 0.26, 'fire', baseY + 0.7);
  aoePulse = 1;                                    // the AOE ring sweeps outward
  // the damage zone leaves its own footprint each tick
  mark(p, 'scorch', AOE_R*0.85, 0.22, 2.2);

  // embers jump at the DAMAGE RADIUS, not just under the cube
  emit({ pos:new THREE.Vector3(p.x, 0.06, p.z), count:12, tex:'ember',
         color:[0xffe9a8,0xffcf6a], colorEnd:0xc23a0c, cPow:0.5, ringR:AOE_R*0.9,
         speed:0.7, up:2.4, grav:4.2, drag:1.3, size:0.11, grow:-0.5,
         life:0.6, spread:0.15, fade:1.1 });

  emit({ pos:new THREE.Vector3(cubeRig.position.x, baseY + 0.55, cubeRig.position.z),

         speed:0.7, up:2.0, grav:-1.8, drag:1.7, size:0.26, grow:0.5,

// ---------------------------------------------------------------- fx: particles
// texture atlas: left half = crisp soft dot (embers/sparks), right = ragged puff (dust/smoke)
/*  Four cells. Cells 0-1 stay soft for dust and smoke; cells 2-3 are hard
    edged to match the drawn elemental shapes. The BLUE channel is a core
    mask, letting one particle carry two flat tones the way the glyphs do. */
function particleAtlas(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  // 0: soft dot (yellow so the blue/core channel stays clear)
  let grd = g.createRadialGradient(32,32,0,32,32,30);
  grd.addColorStop(0,'rgba(255,255,0,1)');
  grd.addColorStop(0.5,'rgba(255,255,0,0.85)');
  grd.addColorStop(1,'rgba(255,255,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  // 1: soft puff
  for (const [x,y,r,a] of [[96,32,24,.55],[86,26,15,.5],[106,38,14,.5],[92,42,12,.45],[104,24,11,.45],[96,32,30,.28]]){
    grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,`rgba(255,255,0,${a})`);
    grd.addColorStop(1,'rgba(255,255,0,0)');
    g.fillStyle = grd; g.fillRect(64,0,64,64);
  }
  // 2: flat disc, crisp edge
  g.fillStyle = 'rgba(255,255,0,1)';
  g.beginPath(); g.arc(160,32,25,0,Math.PI*2); g.fill();
  // 3: two-tone ember, blue channel marks the lighter core
  g.fillStyle = 'rgba(255,255,0,1)';
  g.beginPath(); g.arc(224,32,26,0,Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,255,255,1)';
  g.beginPath(); g.arc(222,29,12,0,Math.PI*2); g.fill();
  return new THREE.CanvasTexture(c);
}
const TEX_OFF = { dot:0.0, puff:0.25, flat:0.5, ember:0.75 };
const PMAX = 1100;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PMAX*3), 3));
pGeo.setAttribute('aColor',   new THREE.BufferAttribute(new Float32Array(PMAX*3), 3));
pGeo.setAttribute('aSize',    new THREE.BufferAttribute(new Float32Array(PMAX), 1));
pGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(PMAX), 1));
pGeo.setAttribute('aOff',     new THREE.BufferAttribute(new Float32Array(PMAX), 1));
pGeo.setDrawRange(0, 0);
const pMat = new THREE.ShaderMaterial({
  uniforms:{ map:{ value: particleAtlas() } },
  transparent:true, depthWrite:false,
  vertexShader:`
    attribute float aSize; attribute vec3 aColor; attribute float aAlpha; attribute float aOff;
    varying vec3 vC; varying float vA; varying float vOff;
    void main(){
      vC = aColor; vA = aAlpha; vOff = aOff;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (340.0 / max(0.001, -mv.z));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform sampler2D map; varying vec3 vC; varying float vA; varying float vOff;
    void main(){
      vec2 uv = vec2(gl_PointCoord.x*0.25 + vOff, gl_PointCoord.y);
      vec4 t = texture2D(map, uv);
      if (t.a * vA < 0.004) discard;
      // blue channel is the core mask: one particle, two flat tones
      vec3 col = mix(vC, vec3(1.0, 0.945, 0.788), t.b);
      gl_FragColor = vec4(col, t.a * vA);
    }`
});
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
scene.add(points);

const parts = [];
const _c0 = new THREE.Color(), _c1 = new THREE.Color();
// o.tex: 'dot' | 'puff'. o.colorEnd + o.cPow: colour grades over life (embers cool)
function emit(o){
  const off = TEX_OFF[o.tex] !== undefined ? TEX_OFF[o.tex] : 0.0;
  for (let i=0;i<o.count;i++){
    if (parts.length >= PMAX) break;
    let a, sp;
    if (o.ringR !== undefined){
      // shockwave: spawn ON a circle, velocity strictly outward
      a = (i/o.count)*Math.PI*2 + Math.random()*0.35;
      sp = o.speed * (0.85 + Math.random()*0.3);
    } else {
      a = Math.random()*Math.PI*2;
      sp = o.speed * (0.45 + Math.random()*0.85);
    }
    const up = o.up * (0.35 + Math.random());
    _c0.setHex(Array.isArray(o.color) ? o.color[(Math.random()*o.color.length)|0] : o.color);
    _c1.setHex(o.colorEnd !== undefined ? o.colorEnd : (Array.isArray(o.color) ? o.color[0] : o.color));
    const rr = o.ringR || 0;
    parts.push({
      p: new THREE.Vector3(
        o.pos.x + Math.cos(a)*rr + (Math.random()-0.5)*o.spread,
        o.pos.y + Math.random()*o.spread*0.5,
        o.pos.z + Math.sin(a)*rr + (Math.random()-0.5)*o.spread),
      v: new THREE.Vector3(Math.cos(a)*sp, up, Math.sin(a)*sp),
      g: o.grav, drag: o.drag,
      size: o.size*(0.6+Math.random()*0.8), grow: o.grow||0,
      life: 0, max: o.life*(0.7+Math.random()*0.6),
      r0:_c0.r, g0:_c0.g, b0:_c0.b, r1:_c1.r, g1:_c1.g, b1:_c1.b,
      cPow: o.cPow || 1, fade: o.fade || 1, off,
      turb: o.turb || 0, seed: Math.random()*100,
      zap: o.zap || 0, zapT: o.zap || 0,

      // than the current velocity, so ~30 heading changes a second can't

}
function stepParticles(dt, t){
  const pa = pGeo.attributes;
  for (let i=parts.length-1;i>=0;i--){
    const q = parts[i];
    q.life += dt;
    if (q.life >= q.max){ parts.splice(i,1); continue; }
    q.v.y -= q.g*dt;
    if (q.zap){
      // surface streamers move in jumps: hold a heading, then snap to a new one
      q.zapT -= dt;
      q.zapSpd *= 1 - Math.min(1, q.drag*dt);     // the crawl still slows with drag
      if (q.zapT <= 0){
        q.zapT = q.zap*(0.6 + Math.random()*0.9);
        const sp = q.zapSpd*(0.75 + Math.random()*0.5);
        const a = Math.random()*Math.PI*2;
        q.v.x = Math.cos(a)*sp; q.v.z = Math.sin(a)*sp;
        q.v.y = Math.abs(q.v.y)*0.4 + 0.5 + Math.random()*0.9;
      }
    }
    if (q.turb){
      // cheap curl: smoke and flame wander instead of rising in straight lines
      q.v.x += Math.sin(t*3.1 + q.seed)      * q.turb * dt;
      q.v.z += Math.sin(t*2.6 + q.seed*1.7)  * q.turb * dt;
    }
    q.v.multiplyScalar(1 - Math.min(1, q.drag*dt));
    q.p.addScaledVector(q.v, dt);
    if (q.p.y < 0.02){ q.p.y = 0.02; q.v.y *= -0.24; q.v.x *= 0.7; q.v.z *= 0.7; }
  }
  for (let i=0;i<parts.length;i++){
    const q = parts[i], k = q.life/q.max;
    const ck = Math.pow(k, q.cPow);
    pa.position.setXYZ(i, q.p.x, q.p.y, q.p.z);
    pa.aColor.setXYZ(i, q.r0+(q.r1-q.r0)*ck, q.g0+(q.g1-q.g0)*ck, q.b0+(q.b1-q.b0)*ck);
    pa.aSize.setX(i, Math.max(0.01, q.size * (1 + q.grow*k)));
    pa.aAlpha.setX(i, Math.pow(1-k, q.fade));
    pa.aOff.setX(i, q.off);
  }
  pGeo.setDrawRange(0, parts.length);
  pa.position.needsUpdate = pa.aColor.needsUpdate = pa.aSize.needsUpdate =
  pa.aAlpha.needsUpdate = pa.aOff.needsUpdate = true;
}

const rings = [];

    color:0xffffff, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false
  }));
  m.rotation.x = -Math.PI/2; m.position.y = 0.015; m.visible = false;
  scene.add(m); rings.push({ mesh:m, live:false });

function ring(pos, opt){
  const r = rings.find(x => !x.live) || rings[0];
  r.live = true; r.t = 0;
  r.dur = opt.dur; r.r0 = opt.r0; r.r1 = opt.r1; r.op = opt.opacity;
  r.mesh.visible = true;
  r.mesh.position.set(pos.x, 0.015 + (opt.y||0), pos.z);
  r.mesh.material.color.setHex(opt.color);
  r.mesh.scale.setScalar(opt.r0);
}
function stepRings(dt){
  for (const r of rings){
    if (!r.live) continue;
    r.t += dt;
    const k = Math.min(1, r.t/r.dur);
    const e = 1 - Math.pow(1-k, 2.6);
    r.mesh.scale.setScalar(r.r0 + (r.r1-r.r0)*e);
    r.mesh.material.opacity = r.op * Math.pow(1-k, 1.7);
    if (k >= 1){ r.live = false; r.mesh.visible = false; }
  }
}

    let x = 128 + Math.cos(ang)*14, y = 128 + Math.sin(ang)*14, w = ang;
    g.strokeStyle = i%3 === 0 ? 'rgba(200,206,255,0.8)' : 'rgba(59,70,224,0.7)';
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(x,y);
    const segs = 4 + ((Math.random()*3)|0);

    for (let s2=0;s2<segs;s2++){
      r += 14 + Math.random()*18;

}
const DECAL_TEX = { scorch: scorchTexture(), crater: craterTexture(), ion: ionTexture() };
const marks = [];
const markGeo = new THREE.PlaneGeometry(2, 2);
for (let i=0;i<8;i++){

  }));

}
function mark(pos, tex, radius, opacity, dur){
  const m = marks.find(x => !x.live) || marks[0];
  m.live = true; m.t = 0; m.dur = dur; m.op = opacity; m.grow = radius;

}
function stepMarks(dt){
  for (const m of marks){
    if (!m.live) continue;
    m.t += dt;
    const k = Math.min(1, m.t/m.dur);
    m.mesh.scale.setScalar(m.grow * (0.4 + 0.6*Math.min(1, k*7)));
    m.mesh.material.opacity = m.op * (1 - k*k);
    if (k >= 1){ m.live = false; m.mesh.visible = false; }

// ---------------------------------------------------------------- fx: lightning
// tapered camera-facing ribbon: white-hot core fading to blue haze at the edge.
// Restrikes: the channel re-randomises twice, the way real return strokes do.
/*  LIGHTNING — two acts.
      ACT 1, THE BOLT: a giant fractal channel built by recursive midpoint
        displacement (real leader tortuosity: displacement halves with each
        subdivision), with downward-forking branches. Rendered as TWO ribbon
        layers over the same path — a hot near-white core inside a wide deep
        indigo corona, which is how a discharge reads against white where
        additive glow is impossible. It wipes to ground in 15ms and restrikes
        twice, and its brightness chatters at ~180Hz on real time.
      ACT 2, THE SPREAD: the charge doesn't stop at the strike point. A front
        expands across the floor to 2.6 units over 0.45s; as it passes it
        spawns short-lived crawling arcs (tangent-biased mini-bolts that hug
        the ground), stepped "zap" sparks whose velocity re-randomises every
        few hundredths of a second the way surface streamers jump, and an
        ionisation shimmer decal. Everything strobes on real time so the
        hit-stop freeze still crackles.                                     */
const ELEC_FRAG = `
  uniform float uOpacity, uReveal, uTime;
  varying float vX, vA, vSeed;
  ${GFX_LIB}
  void main(){
    if (vA > uReveal) discard;
    float d = abs(vX*2.0 - 1.0);
    // per-fragment chatter: the channel brightness is never steady
    float chatter = 0.72 + 0.28*sin(uTime*181.0 + vSeed*39.0 + vA*23.0);
    float core = 1.0 - smoothstep(0.30, 0.46, d);
    float body = 1.0 - smoothstep(0.86, 1.0, d);
    vec3 col = mix(vec3(0.16, 0.17, 0.62), vec3(0.90, 0.92, 1.0), core);
    float a = body * (0.30 + 0.70*core) * uOpacity * chatter;
    if (a < 0.012) discard;
    gl_FragColor = vec4(col, a);
  }`;
function makeElecMat(){
  return new THREE.ShaderMaterial({
    uniforms:{ uOpacity:{ value:0 }, uReveal:{ value:1 }, uTime:{ value:0 } },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    extensions:{ derivatives:true },
    vertexShader:`
      attribute float aAcross, aAlong, aSeed;
      varying float vX, vA, vSeed;
      void main(){
        vX = aAcross; vA = aAlong; vSeed = aSeed;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: ELEC_FRAG,
  });
}

// ---- shared ribbon assembler: polylines -> camera-facing quad strips
function ribbonGeo(polys){
  const pos = [], across = [], along = [], seed = [], idx = [];
  const side = new THREE.Vector3(), dir = new THREE.Vector3();
  for (const P of polys){
    const pts = P.pts, w = P.w, sd = P.seed || 0;
    const a0 = P.a0 !== undefined ? P.a0 : 0, a1 = P.a1 !== undefined ? P.a1 : 1;
    for (let i=0;i<pts.length-1;i++){
      const a = pts[i], b = pts[i+1];
      const t0 = i/(pts.length-1), t1 = (i+1)/(pts.length-1);
      dir.subVectors(b, a);
      side.crossVectors(dir, VIEW_DIR).normalize();
      const wA = w*(P.taper ? (1 - 0.75*t0) : 1), wB = w*(P.taper ? (1 - 0.75*t1) : 1);
      const base = pos.length/3;
      pos.push(
        a.x+side.x*wA, a.y+side.y*wA, a.z+side.z*wA,
        a.x-side.x*wA, a.y-side.y*wA, a.z-side.z*wA,
        b.x+side.x*wB, b.y+side.y*wB, b.z+side.z*wB,
        b.x-side.x*wB, b.y-side.y*wB, b.z-side.z*wB
      );
      across.push(0,1,0,1);
      along.push(a0+(a1-a0)*t0, a0+(a1-a0)*t0, a0+(a1-a0)*t1, a0+(a1-a0)*t1);
      seed.push(sd,sd,sd,sd);
      idx.push(base, base+1, base+2, base+1, base+3, base+2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aAcross',  new THREE.Float32BufferAttribute(across, 1));
  g.setAttribute('aAlong',   new THREE.Float32BufferAttribute(along, 1));
  g.setAttribute('aSeed',    new THREE.Float32BufferAttribute(seed, 1));
  g.setIndex(idx);
  return g;
}

// ---- fractal channel: midpoint displacement, halving per level
const BOLT_TOP = 11.0;
let boltGroundY = 0.55;   // resolved per strike from the terrain column
function fractalPath(a, b, disp, depth, roll){
  let pts = [a.clone(), b.clone()];
  for (let level=0; level<depth; level++){
    const next = [pts[0]];
    for (let i=0;i<pts.length-1;i++){
      const p0 = pts[i], p1 = pts[i+1];
      const mid = p0.clone().add(p1).multiplyScalar(0.5);
      const ang = Math.random()*Math.PI*2;
      mid.x += Math.cos(ang)*disp*(Math.random()*0.9+0.1)*roll;
      mid.z += Math.sin(ang)*disp*(Math.random()*0.9+0.1)*roll;
      next.push(mid, p1);
    }
    pts = next;
    disp *= 0.5;                               // the fractal halving
  }
  return pts;
}
function buildBolt(x, z){
  const top = new THREE.Vector3(x + (Math.random()-0.5)*2.2, BOLT_TOP, z + (Math.random()-0.5)*2.2);
  const hit = new THREE.Vector3(x, boltGroundY, z);
  const main = fractalPath(top, hit, 1.9, 5, 1);
  main[main.length-1].set(x, boltGroundY, z);  // displacement never moves the strike point
  const alongOf = y => Math.max(0, Math.min(1, (BOLT_TOP - y)/(BOLT_TOP - boltGroundY)));
  const polys = [{ pts: main, w: 1, seed: Math.random()*10 }];
  // branches: fork from upper nodes, dive down and out, half the displacement
  const nB = 3 + ((Math.random()*3)|0);
  for (let b=0;b<nB;b++){
    const i = 2 + ((Math.random()*(main.length*0.6))|0);
    const from = main[Math.min(i, main.length-3)];
    const ang = Math.random()*Math.PI*2;
    const len = 1.4 + Math.random()*2.2;
    const to = from.clone().add(new THREE.Vector3(
      Math.cos(ang)*len*0.7, -len, Math.sin(ang)*len*0.7));
    if (to.y < 0.1) to.y = 0.1;
    polys.push({ pts: fractalPath(from, to, 0.8, 4, 1), w: 0.42, seed: Math.random()*10, taper: true, branch:true });
  }
  // per-polyline along coords from world height so one wipe sweeps everything
  for (const P of polys){
    P.a0 = alongOf(P.pts[0].y);
    P.a1 = alongOf(P.pts[P.pts.length-1].y);
  }
  return polys;
}

const boltCoreMat = makeElecMat(), boltHaloMat = makeElecMat();
const boltCore = new THREE.Mesh(new THREE.BufferGeometry(), boltCoreMat);
const boltHalo = new THREE.Mesh(new THREE.BufferGeometry(), boltHaloMat);
for (const m of [boltCore, boltHalo]){
  m.frustumCulled = false; m.visible = false; m.renderOrder = 4;
  scene.add(m);
}
boltHalo.renderOrder = 3;
let boltT = 0, boltDur = 0, boltX = 0, boltZ = 0, restrikes = 0, nextRestrike = 0, boltRevealT = 0;

function setBoltGeometry(x, z){
  const polys = buildBolt(x, z);
  boltCore.geometry.dispose(); boltHalo.geometry.dispose();
  boltCore.geometry = ribbonGeo(polys.map(P => ({ ...P, w: P.w*0.075 })));
  boltHalo.geometry = ribbonGeo(polys.map(P => ({ ...P, w: P.w*0.26 })));
}
function strikeBolt(x, z){
  boltGroundY = H(Math.round(x), Math.round(z)) + 0.05;
  setBoltGeometry(x, z);
  boltCore.visible = boltHalo.visible = true;
  boltT = 0; boltDur = 0.5; boltX = x; boltZ = z;
  restrikes = 2; nextRestrike = 0.12; boltRevealT = 0;
  startSpread(x, z);
}
function stepBolt(dt, rawT){
  if (!boltCore.visible) return;
  boltT += dt; boltRevealT += dt;
  if (restrikes > 0 && boltT >= nextRestrike){
    setBoltGeometry(boltX, boltZ);             // the channel re-forms
    restrikes--; nextRestrike += 0.12; boltRevealT = 0;
    flash(0.4, 'rgba(110,122,255,0.55)');
  }
  const k = boltT/boltDur;
  if (k >= 1){
    boltCore.visible = boltHalo.visible = false;
    boltCoreMat.uniforms.uOpacity.value = boltHaloMat.uniforms.uOpacity.value = 0;
    return;
  }
  const env = Math.pow(1-k, 1.5);
  const reveal = Math.min(1, boltRevealT/0.015);
  for (const m of [boltCoreMat, boltHaloMat]){
    m.uniforms.uOpacity.value = env;
    m.uniforms.uReveal.value = reveal;
    m.uniforms.uTime.value = rawT;             // chatter survives the hit-stop
  }
  boltHaloMat.uniforms.uOpacity.value = env*0.7;
}

// ---- ACT 2: the ground spread ----------------------------------------------
const SPREAD_R = 2.6, SPREAD_DUR = 0.45;
const groundArcMat = makeElecMat();
const groundArcs = new THREE.Mesh(new THREE.BufferGeometry(), groundArcMat);
groundArcs.frustumCulled = false; groundArcs.visible = false; groundArcs.renderOrder = 3;
scene.add(groundArcs);
const spread = { live:false, t:0, x:0, z:0, arcs:[], acc:0 };

function startSpread(x, z){
  spread.live = true; spread.t = 0; spread.x = x; spread.z = z;
  spread.arcs.length = 0; spread.acc = 0;
}
function spawnArc(front){
  const ang = Math.random()*Math.PI*2;
  const r = front*(0.75 + Math.random()*0.3);
  const ax = spread.x + Math.cos(ang)*r, az = spread.z + Math.sin(ang)*r;
  // tangent-biased crawl direction, hugging the floor with little vertical pops
  const tangential = ang + Math.PI/2*(Math.random() < 0.5 ? 1 : -1) + (Math.random()-0.5)*0.9;
  const len = 0.5 + Math.random()*0.7;
  const gy = boltGroundY - 0.02;
  const from = new THREE.Vector3(ax, gy, az);
  const to = new THREE.Vector3(ax + Math.cos(tangential)*len, gy, az + Math.sin(tangential)*len);
  const pts = fractalPath(from, to, 0.22, 3, 1);
  for (const p of pts) p.y = gy + Math.random()*0.10;
  pts[0].y = gy; pts[pts.length-1].y = gy;
  spread.arcs.push({ pts, seed: Math.random()*10, age: 0, life: 0.05 + Math.random()*0.09 });
}
function stepSpread(dt, rawT, rawDt){
  if (!spread.live){ groundArcs.visible = false; return; }
  spread.t += dt;
  const k = Math.min(1, spread.t/SPREAD_DUR);
  const front = SPREAD_R*(1 - Math.pow(1-k, 2.2));   // decelerating front
  if (k < 1){
    spread.acc += dt*90;                              // arcs per second at the front
    while (spread.acc >= 1){
      spread.acc -= 1;
      spawnArc(front);
      // stepped sparks ride the front as it passes
      if (Math.random() < 0.5){
        const a = Math.random()*Math.PI*2;
        emit({ pos: new THREE.Vector3(spread.x + Math.cos(a)*front, 0.05, spread.z + Math.sin(a)*front),
               count: 1, tex:'flat', color:[0xdfe3ff, 0x8f9bff], colorEnd:0x2a35c9, cPow:0.6,
               speed: 1.6, up: 1.6, grav: 8, drag: 0.8, size: 0.085, grow: -0.3,
               life: 0.4, spread: 0.1, fade: 1.1, zap: 0.035 });
      }
    }
  }
  // age arcs on REAL time so they flicker through the hit-stop
  for (let i=spread.arcs.length-1;i>=0;i--){
    const a = spread.arcs[i];
    a.age += rawDt;
    if (a.age >= a.life) spread.arcs.splice(i, 1);
  }
  if (spread.arcs.length === 0 && k >= 1){ spread.live = false; groundArcs.visible = false; return; }
  groundArcs.geometry.dispose();
  groundArcs.geometry = ribbonGeo(spread.arcs.map(a => ({ pts: a.pts, w: 0.05, seed: a.seed, taper: true })));
  groundArcs.visible = spread.arcs.length > 0;
  groundArcMat.uniforms.uOpacity.value = 0.95*(1 - k*0.5);
  groundArcMat.uniforms.uReveal.value = 1;
  groundArcMat.uniforms.uTime.value = rawT;
}

// ---------------------------------------------------------------- fx: burst
/*  Impact fireball: a camera-facing quad whose fbm density balloons and
    gutters out, shaded on the blackbody ramp; hottest at the moment of
    impact, cooling as it expands.                                          */
const BURST_FRAG = `
  uniform float uTime, uProgress;
  varying vec2 vUv;
  ${GFX_LIB}
  void main(){
    vec2 p = (vUv - 0.5)*2.0;
    float r = length(p);
    float n = fbm(p*2.6 + vec2(uTime*0.4, -uTime*2.2));
    float d = r - 0.92 + (n - 0.42)*0.85 + uProgress*0.35;
    float a = (1.0 - smoothstep(-0.25, 0.06, d)) * pow(1.0 - uProgress, 1.3);
    if (a < 0.012) discard;
    float T = clamp((1.0 - r*0.7)*(1.0 - uProgress*0.75) + 0.25, 0.0, 1.0);

const burst = {

function igniteFireball(pos){

function stepFireball(dt, t){

{

/* ===================== THE BLANK: world slice ============================
   One landmark, a tile vocabulary, a face-stamp door, one enemy shape.
   Layout (grid cells; north = -Z = screen-up):

        z=-25   ·  lightning glyph (inside)
        z=-22   ████ door ████     monolith wall, opening at x=0 sealed
        z=-20   ·  socket          wants FIRE pressed face-DOWN
        z=-15   ▲  turret at x=2   pyramid, cross-blast, fire-vulnerable
        z=-12   ░░░ gap row ░░░    x -4..4, one cell deep: leap it
        z=-7    ✦  shrine          grants FIRE to the face touching it
        z= 0    ·  start
========================================================================== */
const CELL = (x,z) => x+','+z;
const W = {
  gap: new Set(),        // rolls refused; leap landings fall
  wall: new Set(),       // never enterable
  doorCell: CELL(0,-22),
  doorOpen: false,
  shrine: { x:0, z:-7, taken:false },
  glyph2: { x:0, z:-25, taken:false },
  socket: { x:0, z:-20 },
  turrets: [],
  turretSeen: false,
  anchor: new THREE.Vector3(0, 0.5, 0),
  stage: 'seek',
  integrity: 3, iframes: 0,
  found: new Set(),
};
// the chasm: wide enough that walking around is a real detour, not an accident
for (let x=-7; x<=7; x++) W.gap.add(CELL(x,-12));
// the sealed chamber: fully enclosed, the door is the only way in
for (let x=-3; x<=3; x++) if (x !== 0) W.wall.add(CELL(x,-22));
for (let z=-23; z>=-27; z--){ W.wall.add(CELL(-3,z)); W.wall.add(CELL(3,z)); }
for (let x=-3; x<=3; x++) W.wall.add(CELL(x,-28));

// sentries: a gauntlet between the chasm and the seal. They occupy their cell,
// so they are obstacles as well as threats, and the cell frees when one dies.
// Kept OFF the socket's own column: a sentry at x=0 forces a detour that
// happens to fix the die's parity for free, which hollows out the seal puzzle.
//
// NOTE: these are deliberately NOT added to W.wall. That set is STRUCTURE —
// the mesh builder erects an ink wall segment on every cell in it, which is
// exactly how each pyramid once got a tall box built on top of it. Sentry
// occupancy is dynamic (it ends when one dies), so isWall() derives it from
// the living turrets instead.
const TURRET_SITES = [[2,-15], [-2,-15], [4,-18], [-4,-18], [1,-19]];

/* ═══════════════════════ TERRAIN CONSTRUCTION REFERENCE ═══════════════════
   The world is geometry, so terrain is BUILT, not sculpted: every hill is a
   stack of unit cubes in grid cells, the way you would build a rolling hill
   out of LEGO. This block is the authority — all terrain work follows it.

   THE FIVE RULES
   1. HEIGHTS ARE INTEGERS. A cell's height h is a count of stacked unit
      cubes, h ≥ 0. There are no half-steps, ramps, or smooth slopes, ever.
      "Rolling" is an illusion made of terraces, exactly as in LEGO.
   2. A SLOPE IS A STAIRCASE. Adjacent cells differing by exactly ±1 are
      rollable: the cube tumbles up or down the step in one ordinary roll
      (same quarter-turn — elevation never changes orientation math).
   3. A CLIFF IS A WALL. |Δh| ≥ 2 between adjacent cells refuses rolls in
      BOTH directions, exactly like the monolith. No pit is enterable that
      cannot be exited.
   4. LEAPS RESPECT THE ARC. A leap passes over a mid cell up to start+1 and
      may land on ground up to start+1. Any DROP is fine — hopping off a
      terrace is allowed and encouraged.
   5. TERRAIN KEEPS ITS DISTANCE. No terrain on, and none within 2 cells of:
      gap rows (leap rims must stay flat), structure walls, the door, the
      socket, pickups, the Keeper, sentries, or the start.

   CONSTRUCTION
   - A HILL is a terraced pyramid: cell height = peak − chebyshev(ring).
     terraceHill(cx, cz, peak) builds one; peak ≤ 3 in this slice.
   - Every summit must be reachable: a ±1 staircase exists on every side of
     a terraceHill by construction. If hand-placing cells with raiseRect,
     verify a staircase path yourself — the QA checks reachability.
   - Author ONLY through these helpers into W.h. Never write W.h directly
     elsewhere; renderer, movement, effects, and QA all read the same map.
   ══════════════════════════════════════════════════════════════════════════ */
W.h = new Map();
const H = (x,z) => W.h.get(CELL(x,z)) || 0;
function raiseRect(x0, z0, x1, z1, h){
  for (let x=x0; x<=x1; x++) for (let z=z0; z<=z1; z++)
    if (h > H(x,z)) W.h.set(CELL(x,z), h);
}
function terraceHill(cx, cz, peak){
  for (let r=0; r<peak; r++){
    const h = peak - r;
    raiseRect(cx-r, cz-r, cx+r, cz+r, h);
  }
}

/*  ---- terrain renderer -------------------------------------------------
    Rule 1 made visible, and made READABLE. The lighting alone cannot show a
    terrace: with the key light at 52 degrees, a top face and the sun-facing
    side both land in the toon ramp's lit band, so a white column's brightest
    edge is invisible against its own top.

    So the value contrast is baked into the albedo, on a physical basis —
    SKY EXPOSURE. A horizontal top sees the whole sky dome. A vertical face
    sees about half of it, so it is materially darker. A crevice sees less
    still: within each stacked unit the value falls toward its base, every
    unit is darker than the one above it, and the ground contact is darkest.
    That is ambient occlusion, authored rather than computed — the same
    reasoning that makes a stack of white LEGO bricks legible in daylight.  */
const SKY_TOP = 1.00;      // full dome
const SKY_SIDE = 0.78;     // a vertical face sees about half the sky
const SKY_CREV = 0.86;     // multiplier at the base of each unit
const SKY_STACK = 0.055;   // each unit below the summit loses this much
{
  const U = 128;
  const grey = v => {
    const c = Math.round(255*v), b = Math.round(255*Math.min(1, v*1.02));  // faint cool cast
    return `rgb(${c},${c},${b})`;
  };
  // top: near-white, with the terrace lip darkening slightly at its edges
  const topTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = U;
    const g = c.getContext('2d');
    g.fillStyle = grey(SKY_TOP); g.fillRect(0,0,U,U);
    const vig = g.createRadialGradient(U/2,U/2,U*0.30, U/2,U/2,U*0.72);
    vig.addColorStop(0,'rgba(150,163,200,0)');
    vig.addColorStop(1,'rgba(150,163,200,0.16)');   // lip occlusion
    g.fillStyle = vig; g.fillRect(0,0,U,U);
    g.strokeStyle = 'rgba(132,148,196,0.70)'; g.lineWidth = 3;
    g.strokeRect(1.5,1.5,U-3,U-3);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
  })();
  // side: one gradient band per stacked unit, darkening downward
  const sideTex = h => {
    const c = document.createElement('canvas'); c.width = U; c.height = U*h;
    const g = c.getContext('2d');
    for (let i=0; i<h; i++){                 // i = units below the summit
      const v = SKY_SIDE - SKY_STACK*i;
      const y = i*U;
      const grd = g.createLinearGradient(0, y, 0, y+U);
      grd.addColorStop(0, grey(v));
      grd.addColorStop(1, grey(v*SKY_CREV));  // crevice at the unit's base
      g.fillStyle = grd; g.fillRect(0, y, U, U);
      g.fillStyle = 'rgba(120,134,178,0.55)'; // the seam between bricks
      g.fillRect(0, y, U, 3);
    }
    // vertical corner occlusion, and the darkest line where it meets the floor
    const edge = g.createLinearGradient(0,0,U,0);
    edge.addColorStop(0,'rgba(120,134,178,0.30)');
    edge.addColorStop(0.14,'rgba(120,134,178,0)');
    edge.addColorStop(0.86,'rgba(120,134,178,0)');
    edge.addColorStop(1,'rgba(120,134,178,0.30)');
    g.fillStyle = edge; g.fillRect(0,0,U,U*h);
    g.fillStyle = 'rgba(104,118,162,0.45)'; g.fillRect(0, U*h-4, U, 4);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
  };

  const topMat = makeToon({ color:0xffffff, map: topTex });
  const sideMats = new Map();
  for (const h of new Set(W.h.values())) sideMats.set(h, makeToon({ color:0xffffff, map: sideTex(h) }));
  for (const [key, h] of W.h){
    const [x, z] = key.split(',').map(Number);
    const side = sideMats.get(h);
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, h, 1),
      [side, side, topMat, side, side, side]);
    m.position.set(x, h/2, z);
    m.castShadow = true;
    m.receiveShadow = true;                 // its top is floor: the cube's
    worldGroup.add(m);                      // contact shadow must land on it
  }
}
