// ---------------- turret brain ----------------
const TURRET_RANGE = 6.5, TURRET_AIM = 1.5, TURRET_COOL = 1.6;
const SPIN_IDLE = 0.5, SPIN_AIM = 12.0;   // a slow drift that becomes a whirl

function stepTurret(dt, t){
  const px = Math.round(state.pos.x), pz = Math.round(state.pos.z);
  const grounded = state.mode !== 'air' && state.mode !== 'fall';
  let anyAiming = false;

  for (const T of W.turrets){
    if (!T.alive) continue;
    const dist = Math.hypot(px - T.x, pz - T.z);
    T.glow = Math.max(0, T.glow - dt*2.6);
    T.resist = Math.max(0, T.resist - dt);

    // spin rate is the readable tell: idle drift, winding to a whirl as it
    // charges, still unwinding through the cooldown
    let rate = SPIN_IDLE;
    if (T.state === 'aim')       rate = SPIN_IDLE + Math.pow(T.t/TURRET_AIM, 1.6)*SPIN_AIM;
    else if (T.state === 'cool') rate = SPIN_IDLE + 3.5*(1 - T.t/TURRET_COOL);
    T.spin += dt*rate;
    T.mesh.rotation.y = T.spin + Math.PI/4;
    T.mesh.position.y = TURRET_H/2 + 0.05*Math.sin(t*2.1 + T.x);

    if (T.state === 'idle'){
      if (dist < TURRET_RANGE && state.mode !== 'fall'){
        if (!W.turretSeen){ W.turretSeen = true; setHint('THEY READ THE SQUARES BEFORE THEY FIRE'); }
        T.state = 'aim'; T.t = 0;
        T.cells = [[T.x,T.z],[px,pz],[px+1,pz],[px-1,pz],[px,pz+1],[px,pz-1]]
          .slice(1).filter(([x,z]) => !isWall(x,z));
        T.cells.forEach(([x,z], i) => {
          if (i < T.planes.length){ T.planes[i].position.set(x, H(x,z) + 0.01, z); T.planes[i].visible = true; }
        });
      }
    }
    else if (T.state === 'aim'){
      anyAiming = true;
      T.t += dt;
      const k = T.t/TURRET_AIM;
      const pulse = 0.14 + 0.3*k + 0.14*Math.sin(t*(8 + k*14));
      T.cells.forEach((c, i) => { if (i < T.planes.length) T.planes[i].material.opacity = pulse; });
      T.glow = Math.max(T.glow, pulse*1.7);
      if (k >= 1){
        T.state = 'cool'; T.t = 0;
        for (const [x,z] of T.cells){
          ring(new THREE.Vector3(x, 0, z), { r0:0.15, r1:0.62, dur:0.28, opacity:0.7, color:TELE_COLOR });
          emit({ pos:new THREE.Vector3(x, 0.08, z), count:6, tex:'flat', color:0xd96a3a,
                 colorEnd:0x7a2a12, speed:1.6, up:2.2, grav:6, drag:1.2, size:0.09,
                 grow:-0.3, life:0.4, spread:0.3, fade:1.1 });
        }
        flash(0.35, 'rgba(190,80,40,0.45)');
        camShake = Math.max(camShake, 0.05);   // impact: sentry blast
        T.glow = 1.6;
        lightBurst(new THREE.Vector3(T.x, 0, T.z), TELE_COLOR, 3.2, 0.45, 'thump', 0.9);
        for (const m of T.planes) m.visible = false;
        if (grounded && W.iframes <= 0 && T.cells.some(([x,z]) => x === px && z === pz)) hurt();
      }
    }
    else if (T.state === 'cool'){
      T.t += dt;
      if (T.t >= TURRET_COOL) T.state = 'idle';
    }

    // it wears the colour it casts
    const gl = Math.min(1.6, T.glow);
    const m = T.mesh.material;
    m.color.copy(TURRET_INK).lerp(TELE_RGB, Math.min(0.75, gl*0.55));
    m.emissive.copy(TELE_RGB).multiplyScalar(gl*0.55);
    if (T.resist > 0) m.emissive.setRGB(0.28, 0.30, 0.36);
  }
  W.anyAiming = anyAiming;
}
function hurt(){
  W.integrity--; W.iframes = 1.0;
  syncPips();
  camShake = Math.max(camShake, 0.18);   // impact: taking damage
  hitStop = Math.max(hitStop, 0.05);
  state.svel -= 10;
  flash(0.6, 'rgba(60,60,72,0.5)');
  if (W.integrity <= 0) respawn();
}
function startFall(){
  state.mode = 'fall';
  state.vy = 0;
  setHint('THE FLOOR BREAKS — HOLD A DIRECTION AND TAP TO LEAP');
}
function respawn(){
  state.pos.copy(W.anchor);
  state.pos.y = H(Math.round(W.anchor.x), Math.round(W.anchor.z)) + 0.5;
  state.landY = state.pos.y;
  state.quat.identity();
  state.mode = 'idle';
  state.leap = false;
  state.vy = 0; state.sy = 1; state.svel = 0; state.starget = 1;
  W.integrity = 3; W.iframes = 1.2;
  syncPips();
  camReady = false;
  camGroundY = H(Math.round(W.anchor.x), Math.round(W.anchor.z));
  flash(0.8, 'rgba(255,255,255,0.9)');
}

// ---------------- per-frame ----------------
function stepWorld(dt, t){
  if (W.iframes > 0) W.iframes -= dt;
  if (bannerT > 0){ bannerT -= dt; if (bannerT <= 0) bannerEl.classList.remove('show'); }
  for (const g of [shrineMesh, glyph2Mesh]){
    g.userData.icon.position.y = 1.05 + 0.1*Math.sin(t*2.2);
    g.userData.icon.rotation.y = t*0.8;
  }
  if (W.doorOpen && doorSlab.position.y > -1.8){
    doorSlab.position.y -= dt*1.6;                 // the seal sinks away
    flood.material.opacity = Math.min(0.9, flood.material.opacity + dt*0.4);
  }
  stepTurret(dt, t);

  // region titles: on entering somewhere new (never mid-fall)
  if (state.mode !== 'fall'){
    const r = regionOf(Math.round(state.pos.x), Math.round(state.pos.z));
    if (r !== curRegion){
      curRegion = r;
      if (!announced.has(r)) announceRegion(r);
    }
  }
  if (locT > 0){ locT -= dt; if (locT <= 0) locEl.classList.remove('show'); }

  // the Keeper: idle motion, and the offer to speak when adjacent
  NPC.mesh.position.y = 0.72 + 0.07*Math.sin(t*1.4);
  NPC.mesh.rotation.y = t*0.35;
  const nd = Math.hypot(state.pos.x - NPC.x, state.pos.z - NPC.z);
  const inRange = nd <= 1.6 && state.mode !== 'fall' && !dialogOpen && !equipOpen;
  if (inRange !== npcInRange){
    npcInRange = inRange;
    speakEl.classList.toggle('on', inRange);
  }
  if (dialogOpen && nd > 2.4) { dialogOpen = false; dialogEl.classList.remove('open'); }

  underEl.textContent = 'UNDER · ' + ABILITY[faceAbility[downFaceIndex()]].label.toUpperCase();
  // stage hints (turret aggro overrides via its own setHint)
  if (!W.anyAiming){
    // the opening stage says nothing: the shrine's glow is the only prompt,
    // and finding it unaided is the point
    if (W.stage === 'seek') setHint('');
    else if (W.stage === 'raise'){
      setHint('ROLL TWICE THE SAME WAY — OR PIVOT — TO RAISE WHAT IS UNDER YOU');
      if (faceAbility[upFaceIndex()] === 'fire') W.stage = 'travel';
    }
    else if (W.stage === 'travel') setHint('A SEAL WAITS FOR FIRE PRESSED INTO IT — PIVOT TO CHOOSE YOUR UNDERSIDE');
    else if (W.stage === 'inside') setHint('THE WAY IS OPEN');
    else if (W.stage === 'done') setHint('TWO GLYPHS FOUND · THE BLANK GOES ON');
  }
}

// ---------------------------------------------------------------- cube state
const state = {
  pos: new THREE.Vector3(0, 0.5, 0),
  quat: new THREE.Quaternion(),
  mode: 'idle',
  rt: 0, rDur: ROLL_DUR, rAxis: new THREE.Vector3(),
  rStart: new THREE.Vector3(), rQuat: new THREE.Quaternion(), rDir: new THREE.Vector3(),
  rEndY: 0.5, landY: 0.5,
  ct: 0, vy: 0, armed: 'normal',
  // airborne leap
  leap: false, aT: 0, aDir: new THREE.Vector3(),
  aStart: new THREE.Vector3(), aTarget: new THREE.Vector3(),
  aQuat0: new THREE.Quaternion(), aAxis: new THREE.Vector3(),
  jumpBuf: 0,
  // pivot: a quarter turn in place, so the down face is not hostage to the map
  kT: 0, kQuat0: new THREE.Quaternion(), kAxis: new THREE.Vector3(),
  pivotArmed: false, moveLock: false,
  sy: 1, svel: 0, starget: 1, stiff: 300, damp: 21,
};
let camShake = 0, camReady = false, hitStop = 0, camKickY = 0, camKickV = 0;
let camGroundY = 0;
const CAM_CLIMB = 4.5;   // how quickly the view settles onto a new terrace
const camPos = new THREE.Vector3(), camWanted = new THREE.Vector3(),
      camTarget = new THREE.Vector3(), lookAhead = new THREE.Vector3();

function upFaceIndex(){
  let best = 0, bd = -2;
  const v = new THREE.Vector3();
  for (let i=0;i<6;i++){
    v.copy(FACE_NORMAL[i]).applyQuaternion(state.quat);
    if (v.y > bd){ bd = v.y; best = i; }
  }
  return best;
}

function rollEase(t){ return t*t*(2.2 - 1.2*t); }

function startRoll(dir){
  state.mode = 'roll';
  state.rt = 0;
  state.rDir.copy(dir);
  state.rStart.copy(state.pos);
  state.rQuat.copy(state.quat);
  state.rEndY = H(Math.round(state.pos.x + dir.x), Math.round(state.pos.z + dir.z)) + 0.5;
  state.rAxis.set(dir.z, 0, -dir.x);
  state.starget = 0.93;
}

function landRoll(){
  // snap from the roll start, not the interpolated pose, so nothing drifts
  state.pos.set(state.rStart.x + state.rDir.x, state.rEndY, state.rStart.z + state.rDir.z);
  // a step down lands harder
  if (state.rEndY < state.rStart.y - 0.4) state.svel -= 3.2;
  tmpQ.setFromAxisAngle(state.rAxis, Math.PI/2);
  state.quat.multiplyQuaternions(tmpQ, state.rQuat).normalize();
  state.mode = 'idle';
  state.starget = 1;
  state.svel -= 3.4;                       // the landing lives in the squash,
                                           // never in the camera

  const edge = new THREE.Vector3(state.pos.x - state.rDir.x*0.5, 0.06, state.pos.z - state.rDir.z*0.5);
  emit({ pos:edge, count:6, tex:'puff', color:[0xd6d2cc,0xe6e2dc], colorEnd:0xf0eeea,
         speed:1.3, up:0.9, grav:2.2, drag:3.2, size:0.15, grow:1.8, life:0.42, spread:0.5, fade:1.6 });

  if (isBurning()){
    // a burning cube leaves a trail: scorched floor and shed embers
    mark(state.pos, 'scorch', 0.95, 0.5, 2.4);
    emit({ pos:edge, count:5, tex:'ember', color:[0xffd98a,0xffb14d], colorEnd:0xb3300a, cPow:0.5,
           speed:1.5, up:1.4, grav:4.0, drag:1.4, size:0.1, grow:-0.5, life:0.55, spread:0.4, fade:1.1 });
  }
}

function tryJump(){
  if (dialogOpen) return;
  if (state.mode !== 'idle'){
    // mid-roll or mid-air presses aren't thrown away; they fire on landing
    if (state.mode === 'roll' || state.mode === 'air') state.jumpBuf = JUMP_BUFFER;
    return;
  }
  state.mode = 'crouch';
  state.ct = 0;
  state.armed = faceAbility[upFaceIndex()];
  state.starget = 0.7;
}

// a roll is refused at walls and gaps with a physical bump, so the tile
// vocabulary is learned through the body before it is understood
function tryMove(d){
  const cx = Math.round(state.pos.x), cz = Math.round(state.pos.z);
  const tx = cx + Math.round(d.x), tz = cz + Math.round(d.z);
  // rule 2/3: a ±1 step rolls, a taller difference is a cliff and refuses
  if (canRoll(tx, tz) && Math.abs(H(tx,tz) - H(cx,cz)) <= 1){ startRoll(d); return true; }
  state.svel -= 2.2;
  emit({ pos:new THREE.Vector3(state.pos.x + d.x*0.5, 0.25, state.pos.z + d.z*0.5),
         count:4, tex:'puff', color:0xd6d2cc, colorEnd:0xefede9, speed:0.8, up:0.6,
         grav:2, drag:3, size:0.12, grow:1.6, life:0.3, spread:0.3, fade:1.6 });
  return false;
}

/*  A cube that can only roll has its underside dictated by the map: in any
    space too tight to loop, every cell admits exactly ONE down face. The
    pivot breaks that coupling — a quarter turn in place, no translation —
    so a face-down requirement can always be met, anywhere.

    It is modal rather than a chord: pressing PIVOT arms it, and the next
    direction turns in place instead of rolling. Holding a direction would
    otherwise have already rolled you before the second input arrived.     */
function startTuck(d){
  state.mode = 'tuck';
  state.kT = 0;
  state.kQuat0.copy(state.quat);
  state.kAxis.set(d.z, 0, -d.x);
  state.starget = 0.84;                    // gather, same as a roll
}
function setPivotArmed(on){
  state.pivotArmed = on;
  pivotEl.classList.toggle('armed', on);
}
function handleGroundInput(){
  const d = desiredDirection();
  if (!d){ state.moveLock = false; return; }   // released: rolling resumes
  if (state.moveLock) return;
  if (state.pivotArmed){
    setPivotArmed(false);
    state.moveLock = true;                     // one turn per press
    startTuck(d);
    return;
  }
  tryMove(d);
}
// called the instant the cube is grounded again: a buffered jump wins over
// continuing to roll, so held-direction movement flows straight into a leap
function resumeFromGround(){
  if (state.jumpBuf > 0){ state.jumpBuf = 0; tryJump(); return; }
  handleGroundInput();
}

function launch(){
  state.mode = 'air';
  state.vy = JUMP_V0;
  state.aT = 0;
  state.starget = 1;
  state.svel += 9.5;

  // direction held through the crouch turns the jump into a two-cell leap
  let d = desiredDirection();
  const h0 = H(Math.round(state.pos.x), Math.round(state.pos.z));
  if (d){
    const midX = Math.round(state.pos.x + d.x),   midZ = Math.round(state.pos.z + d.z);
    const endX = Math.round(state.pos.x + d.x*2), endZ = Math.round(state.pos.z + d.z*2);
    // rule 4: the arc clears +1 of terrain mid-flight, lands on at most +1,
    // and drops any distance happily
    if (!canLeapOver(midX, midZ) || isWall(endX, endZ)
        || H(midX, midZ) > h0 + 1 || H(endX, endZ) > h0 + 1) d = null;
  }
  state.leap = !!d;
  state.landY = d
    ? H(Math.round(state.pos.x + d.x*LEAP_CELLS), Math.round(state.pos.z + d.z*LEAP_CELLS)) + 0.5
    : h0 + 0.5;
  if (d){
    state.aDir.copy(d);
    state.aStart.copy(state.pos);
    state.aTarget.set(state.pos.x + d.x*LEAP_CELLS, state.landY, state.pos.z + d.z*LEAP_CELLS);
    state.aQuat0.copy(state.quat);
    state.aAxis.set(d.z, 0, -d.x);
  }
  emit({ pos:new THREE.Vector3(state.pos.x, 0.05, state.pos.z), count:11, tex:'puff',
         color:[0xd6d2cc,0xe8e4de], colorEnd:0xf1efeb, speed:2.0, up:0.7, grav:2.4, drag:3.0,
         size:0.17, grow:2.0, life:0.5, spread:0.55, fade:1.5 });
  ring(state.pos, { r0:0.25, r1:1.15, dur:0.4, opacity:0.16, color:0xb9b5af });
}

function land(){

  const armedKind = state.armed;
  const groundY = state.pos.y - 0.5;
  state.mode = 'idle';
  state.vy = 0;
  if (state.leap){
    // snap from the launch pose so a leap and two rolls agree exactly
    state.pos.x = state.aTarget.x;
    state.pos.z = state.aTarget.z;
    tmpQ.setFromAxisAngle(state.aAxis, (Math.PI/2)*LEAP_CELLS);
    state.quat.multiplyQuaternions(tmpQ, state.aQuat0).normalize();
    state.leap = false;

  const a = state.armed;

    mark(P, 'scorch', 1.6, 0.95, 3.2);
    // embers: white-hot, cool through orange to a dull red, shrinking as they die
    emit({ pos:flat, count:36, tex:'ember', color:[0xffe9a8,0xffd27a], colorEnd:0xc23a0c, cPow:0.55,
           speed:3.2, up:3.0, grav:5.2, drag:1.3, size:0.17, grow:-0.65, life:0.9, spread:0.45, fade:1.1 });
    // licking flames: rise, wander, gutter
    emit({ pos:flat, count:14, tex:'puff', color:0xff8a2b, colorEnd:0xd23a0c, cPow:0.7,
           speed:0.9, up:2.4, grav:-2.2, drag:1.8, size:0.3, grow:0.4, life:0.62, spread:0.5, fade:1.4, turb:3.2 });
    // smoke plume: grows, greys out, drifts

  else if (a === 'lightning'){
    state.svel -= 13;
    camShake = Math.max(camShake, 0.13);    // impact: lightning
    hitStop = Math.max(hitStop, 0.05);
    strikeBolt(P.x, P.z);                     // act 1: the bolt; act 2 self-starts
    lightBurst(P, 0x8f9bff, 7.5, 0.45, 'strobe', 1.8);
    lightBurst(P, 0x6e7cff, 2.2, 0.6, 'strobe', 0.5);
    flash(0.9, 'rgba(110,122,255,0.6)');
    ring(P, { r0:0.25, r1:SPREAD_R*1.15, dur:0.5, opacity:0.4, color:0x3b46e0 });
    mark(P, 'ion', 1.4, 0.9, 2.0);
    // vertical splash at the strike point itself
    emit({ pos:flat, count:26, tex:'flat', color:[0xdfe3ff,0x8f9bff], colorEnd:0x2a35c9, cPow:0.6,
           speed:4.8, up:4.2, grav:13, drag:0.9, size:0.10, grow:-0.4, life:0.5, spread:0.3, fade:1.1, zap:0.03 });
    emit({ pos:flat, count:6, tex:'puff', color:0xb9bdd6, colorEnd:0xe4e6f0, cPow:1.3,

  else if (a === 'physical'){
    state.svel -= 17;
    camShake = Math.max(camShake, 0.2);     // impact: physical
    hitStop = Math.max(hitStop, 0.07);       // impact frame: the world holds its breath
    camKickV -= 2.8;                        // camera drops with the blow

// ---------------------------------------------------------------- input
const keys = new Set();
addEventListener('keydown', e => {
  if (e.repeat || equipOpen) return;
  if (dialogOpen){
    if (e.key === ' ' || e.key === 'Enter' || e.key.toLowerCase() === 'e'){
      e.preventDefault(); advanceDialog();
    }
    return;
  }
  if (e.key.toLowerCase() === 'e' && npcInRange){ e.preventDefault(); openDialog(); return; }
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'spacebar'){ e.preventDefault(); tryJump(); return; }
  if (k === 'shift'){ e.preventDefault(); setPivotArmed(!state.pivotArmed); return; }
  keys.add(k);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

function keyVector(){
  let x = 0, y = 0;
  if (keys.has('a') || keys.has('arrowleft'))  x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup'))    y += 1;
  if (keys.has('s') || keys.has('arrowdown'))  y -= 1;
  return { x, y };
}

const stickEl = document.getElementById('stick');
const knobEl  = document.getElementById('knob');
let stickId = null, stick = { x:0, y:0 };
const STICK_R = 40;
/*  The cube can only roll along a world axis, so the stick is locked to one
    too: whichever component is larger wins and the other is zeroed. The knob
    slides along the arms of the cross and can never sit at an angle, which is
    exactly what the D-pad shape promises.                                   */
function stickSet(e){
  const r = stickEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2);
  let dy = e.clientY - (r.top + r.height/2);
  if (Math.abs(dx) >= Math.abs(dy)) dy = 0; else dx = 0;
  dx = Math.max(-STICK_R, Math.min(STICK_R, dx));
  dy = Math.max(-STICK_R, Math.min(STICK_R, dy));
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  stick.x = dx/STICK_R; stick.y = -dy/STICK_R;
}
function stickClear(){
  stickId = null; stick.x = stick.y = 0;
  knobEl.style.transform = '';
  knobEl.style.borderColor = '';
}
stickEl.addEventListener('pointerdown', e => {
  if (equipOpen || dialogOpen) return;
  stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId);
  knobEl.style.borderColor = 'var(--mute)';
  stickSet(e);
});
stickEl.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickSet(e); });
stickEl.addEventListener('pointerup', e => { if (e.pointerId === stickId) stickClear(); });
stickEl.addEventListener('pointercancel', stickClear);

const pivotEl = document.getElementById('pivot');
pivotEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (equipOpen || dialogOpen) return;
  setPivotArmed(!state.pivotArmed);
});

// tap anywhere on the world to jump. The stick and footer are separate DOM
// elements layered above the canvas, so their taps never reach this handler.
renderer.domElement.addEventListener('pointerdown', e => {
  if (equipOpen) return;
  e.preventDefault();
  tryJump();
});

/* ===================== EQUIP ===========================================
   The cube is shown as an unfolded net so all six faces and their opposite
   pairings are visible at once, which is the thing that actually matters
   when choosing a loadout. Edits go to a draft; closing commits.         */
const equipEl = document.getElementById('equip');
const equipBtn = document.getElementById('equipBtn');
const equipDone = document.getElementById('equipDone');
const netEl = document.getElementById('net');
const trayEl = document.getElementById('tray');
const ghostEl = document.getElementById('ghost');
const equipNote = document.getElementById('equipNote');

// cross net: TOP over FRONT, with LEFT / FRONT / RIGHT / BACK across the middle
const NET_CELLS = [
  { face:2, col:2, row:1 },
  { face:1, col:1, row:2 }, { face:4, col:2, row:2 },
  { face:0, col:3, row:2 }, { face:5, col:4, row:2 },
  { face:3, col:2, row:3 },
];
let equipOpen = false;
let draft = faceAbility.slice();
let drag = null;            // { kind, fromFace }
let selectedChip = null;

for (const cell of NET_CELLS){
  const d = document.createElement('div');
  d.className = 'slot';
  d.dataset.face = cell.face;
  d.style.gridColumn = cell.col;
  d.style.gridRow = cell.row;
  d.innerHTML = `<span class="ori"></span><span class="tag">${FACE_LABEL[cell.face]}</span>`;
  netEl.appendChild(d);
}
function buildTray(){
  trayEl.innerHTML = '';
  const kinds = [...W.found, 'normal'];
  for (const kind of kinds){
    const c = document.createElement('div');
    c.className = 'chip';
    c.dataset.kind = kind;
    c.innerHTML = `<span class="sw" style="background-image:url(${FACE_URL[kind]})"></span>` +
                  `<span class="nm">${kind === 'normal' ? 'CLEAR' : ABILITY[kind].label.toUpperCase()}</span>`;
    wireDrag(c, () => c.dataset.kind, () => null);
    trayEl.appendChild(c);
  }
}
const slotEls = [...netEl.querySelectorAll('.slot')];

function renderNet(){
  for (const el of slotEls){
    const f = +el.dataset.face, kind = draft[f];
    el.style.backgroundImage = `url(${FACE_URL[kind]})`;
    el.classList.toggle('empty', kind === 'normal');
    // which face is against the floor right now, so a face-down plan is legible
    el.classList.toggle('up', f === equipUp);
    el.classList.toggle('down', f === equipDown);
    el.querySelector('.ori').textContent = f === equipDown ? 'DOWN' : f === equipUp ? 'UP' : '';
  }
  const n = draft.filter(k => k !== 'normal').length;
  const clash = [0,2,4].some(i => draft[i] !== 'normal' && draft[FACE_OPPOSITE[i]] !== 'normal');
  equipNote.textContent = W.found.size === 0
    ? 'Nothing found yet. Glyphs are out there in the Blank.'
    : n === 0
      ? 'Every face is blank. Drag a found glyph onto one to arm it.'
      : `${n} of 6 faces armed.` + (clash ? ' Two abilities share an axis, so they can never follow each other in one roll.' : '');
}

let equipUp = 2, equipDown = 3;
function openEquip(){
  equipOpen = true;
  equipUp = upFaceIndex();
  equipDown = FACE_OPPOSITE[equipUp];
  draft = faceAbility.slice();
  selectedChip = null;
  buildTray();
  renderNet();
  equipEl.classList.add('open');
  keys.clear();                       // don't hold a roll direction through the menu
  stickClear();
}
function closeEquip(){
  equipOpen = false;
  faceAbility = draft.slice();        // committing on close is the save
  applyFaces();
  hudKey = '';                        // force the readout to refresh
  equipBtn.classList.toggle('nudge', faceAbility.every(k => k === 'normal'));
  equipEl.classList.remove('open');
  saveLoadout();
}
equipBtn.addEventListener('click', openEquip);
equipDone.addEventListener('click', closeEquip);

// ---- drag and drop, pointer-based so it works on touch as well as mouse
function slotUnder(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.slot') : null;
}
function beginDrag(kind, fromFace, x, y){
  drag = { kind, fromFace };
  ghostEl.style.backgroundImage = `url(${FACE_URL[kind]})`;
  ghostEl.style.display = 'block';
  moveGhost(x, y);
}
function moveGhost(x, y){
  ghostEl.style.left = x + 'px';
  ghostEl.style.top = y + 'px';
  const over = slotUnder(x, y);
  for (const el of slotEls){
    el.classList.toggle('hover', el === over);
    el.classList.toggle('opp', !!over && +el.dataset.face === FACE_OPPOSITE[+over.dataset.face]);
  }
}
function endDrag(x, y){
  const over = slotUnder(x, y);
  if (over && drag){
    const to = +over.dataset.face;
    if (drag.fromFace !== null && drag.fromFace !== to){
      const tmp = draft[to]; draft[to] = draft[drag.fromFace]; draft[drag.fromFace] = tmp;  // swap
    } else if (drag.fromFace === null){
      draft[to] = drag.kind;
    }
  } else if (drag && drag.fromFace !== null){
    draft[drag.fromFace] = 'normal';                       // dragged off the net: clear
  }
  drag = null;
  ghostEl.style.display = 'none';
  for (const el of slotEls) el.classList.remove('hover','opp');
  renderNet();
}

const DRAG_SLOP = 6;   // px of movement before a press counts as a drag
function wireDrag(el, getKind, getFace){
  let pending = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const kind = getKind(), face = getFace();
    // a blank face has nothing to pick up, but can still receive a tap
    pending = (kind === 'normal' && face !== null) ? null : { kind, face, x0:e.clientX, y0:e.clientY };
  });
  el.addEventListener('pointermove', e => {
    if (drag){ moveGhost(e.clientX, e.clientY); return; }
    if (!pending) return;
    if (Math.hypot(e.clientX - pending.x0, e.clientY - pending.y0) > DRAG_SLOP){
      beginDrag(pending.kind, pending.face, e.clientX, e.clientY);
    }
  });
  el.addEventListener('pointerup', e => {
    if (drag){ pending = null; endDrag(e.clientX, e.clientY); return; }
    pending = null;
    const face = getFace();
    if (face === null){
      // tapped a tray chip: arm it for tap-to-place
      selectedChip = selectedChip === getKind() ? null : getKind();
      for (const c of trayEl.children) c.classList.toggle('sel', c.dataset.kind === selectedChip);
    } else if (selectedChip){
      draft[face] = selectedChip;
      renderNet();
    }
  });
  el.addEventListener('pointercancel', () => {
    pending = null; drag = null; ghostEl.style.display = 'none';
    for (const s2 of slotEls) s2.classList.remove('hover','opp');
  });
}
for (const el of slotEls) wireDrag(el, () => draft[+el.dataset.face], () => +el.dataset.face);

// ---- optional persistence; absent outside the artifact host, so never assume it
async function saveLoadout(){
  try {
    if (typeof window.storage === 'undefined') return;
    await window.storage.set('tumble:loadout', JSON.stringify({ faces: faceAbility, found: [...W.found] }));
  } catch (err) { /* running as a plain file: in-memory only */ }
}
async function loadLoadout(){
  try {
    if (typeof window.storage === 'undefined') return;
    const r = await window.storage.get('tumble:loadout');
    if (!r) return;
    const v = JSON.parse(r.value);
    const faces = Array.isArray(v) ? v : (v && v.faces);
    const found = (v && v.found) || [];
    if (Array.isArray(found)) for (const k of found) if (ABILITY[k] && k !== 'normal') W.found.add(k);
    if (Array.isArray(faces) && faces.length === 6 && faces.every(k => ABILITY[k] && (k === 'normal' || W.found.has(k)))){
      faceAbility = faces;
      applyFaces();
      hudKey = '';
    }
  } catch (err) { /* no saved loadout */ }
  equipBtn.classList.toggle('nudge', faceAbility.every(k => k === 'normal'));
}

/* ===================== GAMEPAD =========================================
   Polled once per frame rather than event-driven, because the Gamepad API
   has no input events — navigator.getGamepads() is a snapshot.

   The stick is axis-locked exactly as the D-pad is: the cube only rolls along
   a world axis, so the larger component wins and the other is discarded. The
   hat (D-pad buttons) is read too, and beats the analog stick when both are
   live, since a hat press is unambiguous by construction.

   Buttons are edge-detected against the previous frame's snapshot: the API
   reports level, and the game needs "was just pressed" for jump and pivot.  */
const PAD_DEAD = 0.38;              // matches the touch stick's dead zone
const PAD = { x:0, y:0, prev:new Map(), connected:false, id:'' };
/*  Standard gamepad mapping indices. A and B are the two verbs the player
    uses constantly, so they take the two buttons the thumb rests on:
      A (0) jump — also confirms dialogue and speaks to the Keeper
      B (1) pivot
    X/Y and the shoulders are left unbound rather than aliased onto these,
    so a mis-hit does nothing instead of doing the wrong verb.             */
const PAD_BTN = {
  jump:   [0],                      // A / cross — also confirms dialogue
  pivot:  [1],                      // B / circle
  speak:  [3],                      // Y / triangle — opens a conversation
  equip:  [9, 8],                   // start / select
  up:12, down:13, left:14, right:15,
};
function padSet(connected, id){
  if (PAD.connected === connected) return;
  PAD.connected = connected;
  PAD.id = id || '';
  document.body.classList.toggle('pad', connected);
  if (!connected){ PAD.x = PAD.y = 0; PAD.prev.clear(); }
  else { stickClear(); }             // hand over cleanly, no stuck direction
  // a banner, not setHint: stepWorld rewrites the hint line every frame with
  // the current stage, so a hint here would be erased before it was read
  showBanner(connected ? 'CONTROLLER CONNECTED' : 'CONTROLLER DISCONNECTED', 2.2);
}
addEventListener('gamepadconnected', e => padSet(true, e.gamepad.id));
addEventListener('gamepaddisconnected', () => {
  const list = readPads();
  padSet(!!list && [...list].some(g => g && g.connected), '');
});
/*  The API can EXIST and still throw: inside an iframe whose permissions
    policy omits "gamepad", getGamepads() raises SecurityError on every call.
    Feature-detecting the method is therefore not enough — it has to be
    called once to know. One failure disables polling permanently, otherwise
    the throw repeats every frame and floods the console.                   */
let padAvailable = typeof navigator.getGamepads === 'function';
let padBlocked = false;
function readPads(){
  if (!padAvailable) return null;
  try {
    return navigator.getGamepads();
  } catch (err){
    padAvailable = false;
    if (!padBlocked){
      padBlocked = true;
      console.info('Gamepad unavailable here (blocked by permissions policy); touch and keyboard remain.');
    }
    return null;
  }
}
function firstPad(){
  const list = readPads();
  if (!list) return null;
  for (const g of list) if (g && g.connected) return g;
  return null;
}
function pollPad(){
  if (!padAvailable) return;         // blocked or unsupported: cost is one check
  const g = firstPad();
  if (!g){ if (PAD.connected) padSet(false); return; }
  if (!PAD.connected) padSet(true, g.id);

  // ---- direction: hat first, then the axis-locked analog stick
  const btn = i => !!(g.buttons[i] && g.buttons[i].pressed);
  let hx = (btn(PAD_BTN.right) ? 1 : 0) - (btn(PAD_BTN.left) ? 1 : 0);
  let hy = (btn(PAD_BTN.up) ? 1 : 0) - (btn(PAD_BTN.down) ? 1 : 0);
  if (hx || hy){
    if (Math.abs(hx) >= Math.abs(hy)) hy = 0; else hx = 0;
    PAD.x = hx; PAD.y = hy;
  } else {
    let ax = g.axes[0] || 0, ay = -(g.axes[1] || 0);
    if (Math.abs(ax) >= Math.abs(ay)) ay = 0; else ax = 0;   // one axis only
    PAD.x = Math.abs(ax) >= PAD_DEAD ? ax : 0;
    PAD.y = Math.abs(ay) >= PAD_DEAD ? ay : 0;
  }

  // ---- edge-detected buttons
  const pressed = i => {
    const now = btn(i), was = PAD.prev.get(i) || false;
    PAD.prev.set(i, now);
    return now && !was;
  };
  const anyPressed = list => list.map(pressed).some(Boolean);   // map, not some: poll every button

  const jump = anyPressed(PAD_BTN.jump);
  const pivot = anyPressed(PAD_BTN.pivot);
  const speak = anyPressed(PAD_BTN.speak);
  const equip = anyPressed(PAD_BTN.equip);

  if (dialogOpen){ if (jump || speak) advanceDialog(); return; }
  if (equipOpen){ if (equip) closeEquip(); return; }
  if (equip){ openEquip(); return; }
  // Y opens a conversation; A stays purely a jump, so standing next to the
  // Keeper no longer swallows the jump button
  if (speak && npcInRange){ openDialog(); return; }
  if (jump) tryJump();
  if (pivot) setPivotArmed(!state.pivotArmed);
}

// screen-space basis: fixed, because the camera never rotates
const WORLD_UP = new THREE.Vector3(0,1,0);
const camFwd = new THREE.Vector3(-CAM_OFFSET.x, 0, -CAM_OFFSET.z).normalize();
const camRight = new THREE.Vector3().crossVectors(camFwd, WORLD_UP).normalize();
function desiredDirection(){
  if (equipOpen || dialogOpen) return null;
  const k = keyVector();
  if (PAD.connected && (PAD.x || PAD.y)){ k.x = PAD.x; k.y = PAD.y; }
  let ix = stick.x, iy = stick.y;
  if (Math.hypot(ix, iy) < 0.36){ ix = k.x; iy = k.y; }
  if (Math.hypot(ix, iy) < 0.36) return null;
  const d = new THREE.Vector3()
    .addScaledVector(camRight, ix)
    .addScaledVector(camFwd, iy);
  d.y = 0;
  if (d.lengthSq() < 1e-6) return null;
  return Math.abs(d.x) >= Math.abs(d.z)
    ? new THREE.Vector3(Math.sign(d.x), 0, 0)
    : new THREE.Vector3(0, 0, Math.sign(d.z));
}

/* ===================== CAMERA DEBUG ====================================
   The camera orientation is baked into six places at startup (VIEW_DIR, the
   fire billboard basis, the impact quad's yaw, and the input basis), because
   it normally never changes. Anything that moves it live has to rebuild all
   of them, which is what recomputeCameraBasis does.                       */
const CAM_DEFAULTS = (() => {
  const h = Math.hypot(CAM_OFFSET.x, CAM_OFFSET.z);
  return {
    yaw: Math.atan2(CAM_OFFSET.x, CAM_OFFSET.z)*180/Math.PI,
    pitch: Math.atan2(CAM_OFFSET.y, h)*180/Math.PI,
    dist: CAM_OFFSET.length(),
    fov: camera.fov,
    aim: camLookY,
    fogN: scene.fog.near,
    fogF: scene.fog.far,
  };
})();
const camCfg = { ...CAM_DEFAULTS };

function recomputeCameraBasis(){
  VIEW_DIR.copy(CAM_OFFSET).normalize();
  camFwd.set(-CAM_OFFSET.x, 0, -CAM_OFFSET.z).normalize();
  camRight.crossVectors(camFwd, WORLD_UP).normalize();
  SCR_RIGHT.crossVectors(WORLD_UP, VIEW_DIR).normalize();
  SCR_UP.crossVectors(VIEW_DIR, SCR_RIGHT).normalize();
  burst.mesh.rotation.y = Math.atan2(CAM_OFFSET.x, CAM_OFFSET.z);
}

function applyCam(){
  const yaw = camCfg.yaw*Math.PI/180, pitch = camCfg.pitch*Math.PI/180;
  const h = camCfg.dist*Math.cos(pitch);
  CAM_OFFSET.set(h*Math.sin(yaw), camCfg.dist*Math.sin(pitch), h*Math.cos(yaw));
  camLookY = camCfg.aim;
  camera.fov = camCfg.fov;
  camera.updateProjectionMatrix();
  scene.fog.near = camCfg.fogN;
  scene.fog.far = Math.max(camCfg.fogN + 5, camCfg.fogF);
  recomputeCameraBasis();
  camReady = false;                       // let the rig snap to the new pose
  writeCamOut();
}

const camDbgEl = document.getElementById('camdbg');
const camOutEl = document.getElementById('camOut');

// ---------------------------------------------------------------- HUD
const swEl = document.getElementById('sw'), nmEl = document.getElementById('nm'), sbEl = document.getElementById('sb');
const burnEl = document.getElementById('burn'), bfillEl = document.getElementById('bfill'), btickEl = document.getElementById('btick');
let hudKey = '';
function updateHud(key){
  if (key === hudKey) return;
  hudKey = key;
  const a = ABILITY[key];
  swEl.style.background = a.css;
  swEl.style.transform = 'scale(1.35)';
  setTimeout(() => { swEl.style.transform = ''; }, 150);
  nmEl.textContent = a.label;
  nmEl.style.color = key === 'normal' ? '#22222a' : a.css;
  sbEl.textContent = a.line;
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  const rawDt = Math.min(clock.getDelta(), 1/30);
  const t = clock.elapsedTime;

  // hit-stop: the whole sim runs at 12% for a few frames; camera shake and
  // light flicker keep real time so the freeze still feels alive
  let dt = rawDt;
  if (hitStop > 0){ hitStop -= rawDt; dt = rawDt*0.12; }

  // ---- state machine
  if (state.mode === 'idle'){
    handleGroundInput();
  }
  else if (state.mode === 'tuck'){
    state.kT += dt;
    const p = Math.min(1, state.kT/TUCK_DUR);
    const gy = H(Math.round(state.pos.x), Math.round(state.pos.z)) + 0.5;
    state.pos.y = gy + Math.sin(p*Math.PI)*TUCK_LIFT;
    const rp = smoothstep01(Math.max(0, Math.min(1, (p - 0.12)/0.76)));
    tmpQ.setFromAxisAngle(state.kAxis, rp*Math.PI/2);
    state.quat.multiplyQuaternions(tmpQ, state.kQuat0);
    if (p > 0.2 && state.starget < 1) state.starget = 1;
    if (p >= 1){
      state.pos.y = gy;
      tmpQ.setFromAxisAngle(state.kAxis, Math.PI/2);
      state.quat.multiplyQuaternions(tmpQ, state.kQuat0).normalize();
      state.mode = 'idle';
      state.svel -= 4.0;
      emit({ pos:new THREE.Vector3(state.pos.x, 0.05, state.pos.z), count:7, tex:'puff',
             color:[0xd6d2cc,0xe6e2dc], colorEnd:0xf0eeea, speed:1.5, up:0.7,
             grav:2.2, drag:3.0, size:0.15, grow:1.8, life:0.4, spread:0.5, fade:1.6 });
      worldOnGrounded();
      if (state.mode === 'idle') resumeFromGround();
    }
  }
  else if (state.mode === 'roll'){
    state.rt += dt;
    const k = Math.min(1, state.rt/state.rDur);
    const e = rollEase(k);
    const ang = e * Math.PI/2;
    tmpQ.setFromAxisAngle(state.rAxis, ang);
    /*  Position is parametric rather than pivot-derived, because a unit cube
        cannot physically climb a unit step in one quarter-pivot (it takes
        two). The GRAMMAR stays one-quarter-turn-per-cell — the same tmpQ as
        on flat ground, so all orientation math and the seal puzzle hold —
        and the body lifts through the step on a sine arc. On flat ground
        the 0.21 lift matches the old pivot arc's apex, so nothing changed
        visually there.                                                     */
    const lift = 0.21 + 0.24*Math.max(0, state.rEndY - state.rStart.y);
    state.pos.x = state.rStart.x + state.rDir.x*e;
    state.pos.z = state.rStart.z + state.rDir.z*e;
    state.pos.y = state.rStart.y + (state.rEndY - state.rStart.y)*e + lift*Math.sin(e*Math.PI);
    state.quat.multiplyQuaternions(tmpQ, state.rQuat);
    if (k > 0.22 && state.starget < 1) state.starget = 1;
    if (k >= 1){
      landRoll();
      worldOnGrounded();
      if (state.mode === 'idle') resumeFromGround();
    }
  }
  else if (state.mode === 'fall'){
    state.vy -= GRAV*1.4*dt;
    state.pos.y += state.vy*dt;
    if (state.pos.y < -3.5) respawn();
  }
  else if (state.mode === 'crouch'){
    state.ct += dt;
    if (state.ct >= CROUCH_DUR) launch();
  }
  else if (state.mode === 'air'){
    const g = (Math.abs(state.vy) < HANG_ZONE) ? GRAV*HANG_MUL : GRAV;
    state.vy -= g*dt;
    state.pos.y += state.vy*dt;
    state.aT += dt;
    if (state.leap){
      // horizontal travel is linear, as a real projectile's is
      const p = Math.min(1, state.aT/FLIGHT_DUR);
      state.pos.x = state.aStart.x + (state.aTarget.x - state.aStart.x)*p;
      state.pos.z = state.aStart.z + (state.aTarget.z - state.aStart.z)*p;
      // the tumble holds for a beat, then finishes before touchdown so the
      // cube is already flat when it lands and the squash can do its job
      const rp = Math.max(0, Math.min(1, (p - 0.08)/0.80));
      tmpQ.setFromAxisAngle(state.aAxis, smoothstep01(rp)*(Math.PI/2)*LEAP_CELLS);
      state.quat.multiplyQuaternions(tmpQ, state.aQuat0);
    }
    if (state.pos.y <= state.landY && state.vy < 0){
      land();
      worldOnGrounded();
      if (state.mode === 'idle') resumeFromGround();
    }
  }

  if (state.jumpBuf > 0) state.jumpBuf = Math.max(0, state.jumpBuf - dt);

  // ---- squash spring
  const acc = -state.stiff*(state.sy - state.starget) - state.damp*state.svel;
  state.svel += acc*dt;
  state.sy   += state.svel*dt;
  state.sy = Math.max(0.45, Math.min(1.55, state.sy));

  let sy = state.sy;
  if (state.mode === 'air') sy *= 1 + Math.max(-0.18, Math.min(0.26, state.vy*0.035));
  const sxz = 1/Math.sqrt(Math.max(0.2, sy));

  const height = Math.max(0, state.pos.y - 0.5);
  const kAnchor = Math.min(1, height/0.45);
  cubeRig.position.set(state.pos.x, state.pos.y*(kAnchor + (1-kAnchor)*sy), state.pos.z);
  cubeRig.scale.set(sxz, sy, sxz);
  cube.quaternion.copy(state.quat);

  // ---- burning status
  const cubeBaseY = Math.max(0, cubeRig.position.y - 0.5*sy);
  const bi = stepBurn(dt, t, cubeBaseY);
  if (burn.dur > 0){
    burnEl.classList.add('on');
    bfillEl.style.transform = `scaleX(${(1 - burn.t/burn.dur).toFixed(3)})`;
  } else if (bi <= 0){
    burnEl.classList.remove('on');
  }

  // ---- armed face + telegraph
  const faceKey = faceAbility[upFaceIndex()];
  const shown = (state.mode === 'crouch' || state.mode === 'air') ? state.armed : faceKey;
  updateHud(shown);

  // char + cooling glow: the cube blackens, then glows down like hot metal
  const charK = burn.char*0.72;
  const emberFlicker = 0.82 + 0.18*Math.sin(t*24.0) + 0.08*Math.sin(t*9.3);
  const heatE = burn.heat*0.5*emberFlicker;
  for (let i=0;i<6;i++){
    const m = cubeMats[i];
    m.color.setRGB(1 - charK*0.72, 1 - charK*0.82, 1 - charK*0.88);
    m.emissive.setRGB(heatE, heatE*0.28, heatE*0.05);
  }
  const upi = upFaceIndex();
  if (faceAbility[upi] !== 'normal'){
    const pulse = 0.10 + 0.05*Math.sin(t*5.5);
    const c = new THREE.Color(ABILITY[faceAbility[upi]].color).multiplyScalar(pulse);
    cubeMats[upi].emissive.add(c);
  }
  glow.position.set(state.pos.x, 0.012, state.pos.z);
  const wantGlow = shown === 'normal' ? 0 : (state.mode === 'crouch' ? 0.4 : 0.17 + 0.05*Math.sin(t*5.5));
  glow.material.opacity += (wantGlow - glow.material.opacity) * Math.min(1, rawDt*9);
  glow.material.color.setHex(ABILITY[shown === 'normal' ? 'normal' : shown].color);
  glow.scale.setScalar(1 + height*0.35);

  // ---- fx (sim time)
  stepParticles(dt, t);
  stepRings(dt);
  stepMarks(dt);
  pollPad();
  stepWorld(dt, t);
  stepBolt(dt, t);
  stepSpread(dt, t, rawDt);
  stepFireball(dt, t);
  stepCracksNoop();
  stepDebris(dt);
  // lights run on REAL time so flicker survives the hit-stop
  stepLights(rawDt, t);

  flashV *= Math.exp(-9*rawDt);
  flashEl.style.opacity = flashV.toFixed(3);

  // ---- camera
  // resting ground under the cube: the destination of whatever move is in
  // flight, so it steps once per terrace instead of tracking the arc
  const restY =
      state.mode === 'roll' ? state.rEndY - 0.5
    : (state.mode === 'air' || state.mode === 'crouch') ? state.landY - 0.5
    : state.mode === 'fall' ? camGroundY
    : H(Math.round(state.pos.x), Math.round(state.pos.z));
  camGroundY += (restY - camGroundY) * (1 - Math.exp(-CAM_CLIMB*dt));

  /*  The camera's horizontal input is LINEAR roll progress, never the eased
      cube. rollEase makes the cube's velocity pulse 0 -> 7.1 -> 4.2 -> 0
      every single roll; a 5.26Hz pulse sails through the follow filter and
      reads as directional shaking. The ease is the CUBE's animation — the
      camera tracks the underlying constant-rate motion, so chained rolls
      produce perfectly uniform pursuit. Leaps and jumps are already linear
      horizontally, and the pivot does not translate.                       */
  const camFollowX = state.mode === 'roll'
    ? state.rStart.x + state.rDir.x*Math.min(1, state.rt/state.rDur)
    : state.pos.x;
  const camFollowZ = state.mode === 'roll'
    ? state.rStart.z + state.rDir.z*Math.min(1, state.rt/state.rDur)
    : state.pos.z;

  /*  The camera follows the GROUND under the cube, never the cube's own y.
      state.pos.y carries the roll's arc lift and the jump, so tracking it
      bobbed the view on every single roll. The terrain height is a step
      function — flat ground holds it perfectly still — and it is eased so
      that climbing a terrace is a slow rise rather than a snap.           */
  camTarget.set(camFollowX, camGroundY, camFollowZ);
  const aim = (state.mode === 'roll') ? state.rDir : (state.leap ? state.aDir : null);
  lookAhead.lerp(aim ? tmpV.copy(aim).multiplyScalar(0.85) : tmpV.set(0,0,0), Math.min(1, dt*4));
  camTarget.add(lookAhead);

  camWanted.copy(camTarget).add(CAM_OFFSET);

  if (!camReady){ camPos.copy(camWanted); camReady = true; }
  camPos.lerp(camWanted, 1 - Math.exp(-5.2*dt));

  // vertical kick spring: the camera dips with heavy hits, then recovers
  camKickV += (-90*camKickY - 12*camKickV)*rawDt;
  camKickY += camKickV*rawDt;

  camShake *= Math.exp(-7.5*rawDt);
  if (camShake < 0.004) camShake = 0;      // no sub-pixel dither tail
  camera.position.set(
    camPos.x + (Math.random()-0.5)*camShake,
    camPos.y + camKickY + (Math.random()-0.5)*camShake,
    camPos.z + (Math.random()-0.5)*camShake
  );
  camera.lookAt(camTarget.x, camTarget.y + camLookY, camTarget.z);

  // key light from screen-left and slightly forward, so the contact shadow
  // sweeps across the grid to the right instead of hiding behind the cube
  sun.position.set(state.pos.x - 8.0, 10.5, state.pos.z + 1.0);
  sun.target.position.set(state.pos.x, 0, state.pos.z);
  sun.target.updateMatrixWorld();

  // the floor rides along, snapped to whole tiles so the lines stay put
  ground.position.x = Math.round(state.pos.x/GRID_PERIOD)*GRID_PERIOD;
  ground.position.z = Math.round(state.pos.z/GRID_PERIOD)*GRID_PERIOD;

  renderer.render(scene, camera);
}
function stepCracksNoop(){ /* cracks are baked into the crater decal now */ }

updateHud('normal');
equipBtn.classList.add('nudge');
loadLoadout();
tick();
</script>
